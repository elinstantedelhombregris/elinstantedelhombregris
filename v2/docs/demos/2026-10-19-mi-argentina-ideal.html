  Mi Argentina ideal — prototipo de la revisión 2 (19/10/2026).

  Qué es: un HTML autónomo para sentir en el teléfono los tres momentos de
  `docs/specs/2026-10-19-mi-argentina-ideal-la-pila.md` — Imaginar, Mirar y Ver —
  antes de escribir una migración. Sirve para la prueba con cinco personas de la
  spec §10.

  Qué no es: no toca la base, no llama a ninguna API, no entra al bundle de la app
  y no alimenta ningún conteo. Los 44 aportes están escritos a mano a partir de
  `docs/2026-08-19-la-argentina-plausible.md`; los conteos son inventados, fijos y
  coherentes con ellos (sin azar). Las reglas de la tanda y de la visión son las de
  la spec, al pie de la letra, para que lo que se prueba sea lo que se va a construir.

  La frase que gobierna todo, adentro del lienzo: «Nadie dijo ninguna de estas cosas.»
  Santa Cruz está muda a propósito: el silencio también es un dato.

  Tipografías: Anton, Archivo y Space Mono, las de Papel y Tinta, embebidas desde
  `apps/web/public/fonts-ui/` para no pedirle nada a un tercero (D-049).

/* Layout: una columna de teléfono, centrada; en pantallas anchas la nota de diseño va al costado. */
:root {
  --papel: #F2EFE7; --crudo: #FBFAF4; --presionado: #ECE8DC; --borde: #D8D4C8;
  --tinta: #16130E; --tinta-75: #4A463D; --tinta-50: #6B665C; --tinta-30: #B5B1A8;
  --violeta: #5227CC; --violeta-fuerte: #3D1BA3; --sello: #C23B22;

  --fondo: var(--papel); --hoja: var(--crudo); --hundido: var(--presionado);
  --texto: var(--tinta); --texto-2: var(--tinta-75); --texto-3: var(--tinta-50); --apagado: var(--tinta-30);
  --linea: var(--borde); --accion: var(--violeta); --accion-hover: var(--violeta-fuerte); --sobre-accion: #FBFAF4;
  --marca: var(--violeta); --rojo: var(--sello); --sombra: rgba(22, 19, 14, 0.14); --velo: rgba(22, 19, 14, 0.42);
  --luz-0: #E6E1D4; --luz-1: #D3D6D8; --luz-2: #B9C0C7; --luz-3: #9CA6B1; --luz-4: #7F8B98; --luz-5: #5F6C7B;

  --f-display: 'Anton', 'Arial Narrow', Impact, 'Franklin Gothic Bold', sans-serif;
  --f-texto: 'Archivo', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --f-mono: 'Space Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --fondo: #16130E; --hoja: #201B14; --hundido: #2A241B;
  --texto: #F2EFE7; --texto-2: #C9C5BA; --texto-3: #9A958B; --apagado: #5C594F;
  --linea: #3A362D; --accion: #9D85E8; --accion-hover: #B7A6EE; --sobre-accion: #16130E;
  --marca: #9D85E8; --rojo: #E8846F; --sombra: rgba(0, 0, 0, 0.5); --velo: rgba(0, 0, 0, 0.6);
  --luz-0: #241F17; --luz-1: #3B3F45; --luz-2: #5A626C; --luz-3: #808B97; --luz-4: #AAB5C2; --luz-5: #D6DEE8;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --fondo: #16130E; --hoja: #201B14; --hundido: #2A241B;
  --texto: #F2EFE7; --texto-2: #C9C5BA; --texto-3: #9A958B; --apagado: #5C594F;
  --linea: #3A362D; --accion: #9D85E8; --accion-hover: #B7A6EE; --sobre-accion: #16130E;
  --marca: #9D85E8; --rojo: #E8846F; --sombra: rgba(0, 0, 0, 0.5); --velo: rgba(0, 0, 0, 0.6);
  --luz-0: #241F17; --luz-1: #3B3F45; --luz-2: #5A626C; --luz-3: #808B97; --luz-4: #AAB5C2; --luz-5: #D6DEE8;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--fondo); color: var(--texto); font-family: var(--f-texto);
  font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accion); outline-offset: 2px; }

.sitio { display: grid; grid-template-columns: minmax(0, 480px); justify-content: center; gap: 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 56px; }
@media (min-width: 1020px) {
  .sitio { grid-template-columns: minmax(0, 480px) 300px; align-items: start; gap: 48px; }
  .nota { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 18px); }
  .nota .nota-boton { display: none; }
  .nota-cuerpo { display: block !important; }
}

/* ── Marco de la app ── */
.app { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.barra { display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  border-bottom: 2px solid var(--texto); padding-bottom: 8px; }
.wordmark { font-family: var(--f-display); font-size: 26px; letter-spacing: 0.01em; line-height: 1; margin: 0; }
.wordmark b { color: var(--marca); font-weight: 400; }
.kicker { font-family: var(--f-mono); font-size: 11px; font-weight: 700; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--texto-3); margin: 0; }
.pasos { display: grid; grid-template-columns: repeat(3, 1fr); border: 1.5px solid var(--texto); }
.pasos button { background: transparent; border: 0; border-right: 1.5px solid var(--texto); padding: 9px 4px 8px;
  font-family: var(--f-mono); font-size: 11.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  cursor: pointer; min-height: 40px; }
.pasos button:last-child { border-right: 0; }
.pasos button span { color: var(--texto-3); margin-right: 6px; }
.pasos button[aria-current="step"] { background: var(--texto); color: var(--fondo); }
.pasos button[aria-current="step"] span { color: var(--apagado); }
.ejemplo { border: 1.5px dashed var(--rojo); color: var(--rojo); padding: 6px 10px; margin: 0;
  font-family: var(--f-mono); font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.pantalla { display: flex; flex-direction: column; gap: 16px; min-width: 0; outline: none; }

/* ── Tipografía ── */
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: 0.005em; }
h1 { font-size: clamp(34px, 9vw, 44px); line-height: 1.02; }
h2 { font-size: 27px; line-height: 1.05; }
h3 { font-size: 20px; line-height: 1.1; }
p { margin: 0; }
.bajada { color: var(--texto-2); font-size: 15.5px; max-width: 60ch; }
.chico { font-size: 13.5px; color: var(--texto-3); }
.num { font-variant-numeric: tabular-nums; }

/* ── Controles ── */
.boton { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 12px 18px;
  font-family: var(--f-mono); font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  border: 2px solid var(--texto); background: transparent; cursor: pointer; text-align: center; }
.boton.principal { background: var(--accion); border-color: var(--accion); color: var(--sobre-accion); }
.boton.principal:hover { background: var(--accion-hover); border-color: var(--accion-hover); }
.boton.ancho { width: 100%; }
.enlace { background: none; border: 0; padding: 6px 0; color: var(--texto-2); text-decoration: underline;
  text-underline-offset: 3px; cursor: pointer; font-size: 15px; text-align: left; }
.campo { width: 100%; background: var(--hoja); border: 1.5px solid var(--texto); padding: 14px; font-size: 18px;
  line-height: 1.45; resize: vertical; border-radius: 0; }
.campo.grande { min-height: 150px; }
.contador { font-family: var(--f-mono); font-size: 12px; color: var(--texto-3); text-align: right; }
.contador.pasado { color: var(--rojo); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--linea); background: var(--hoja); padding: 7px 12px; font-size: 14px; cursor: pointer; min-height: 38px; }
.chip[aria-pressed="true"] { border-color: var(--texto); background: var(--texto); color: var(--fondo); }
.chip.sugerido { border-color: var(--accion); border-style: dashed; }
.pista { border-left: 3px solid var(--accion); padding: 4px 0 4px 12px; color: var(--texto-2); font-size: 15px; min-height: 30px; }

/* La tanda: primero donde tu región no llega a cinco; después menos opiniones; después más viejo. */
function armarTanda() {
  const r = regionMia(); const priorizar = E.priorizar;
  const candidatos = APORTES.filter((a) => !E.resp[a.id] && !E.reportados.has(a.id));
  const urgente = (a) => (r !== null && a.n[r] < 5) || (priorizar !== null && a.n[priorizar] < 5);
  const respuestas = (a) => a.n.reduce((x, y) => x + y, 0) + a.pasos;
  candidatos.sort((x, y) => (urgente(y) - urgente(x)) || (respuestas(x) - respuestas(y)) || (x.orden - y.orden) || x.id.localeCompare(y.id));
  const elegidos = [];
  const usados = new Set();
  while (elegidos.length < 10 && usados.size < candidatos.length) {
    const lugar = elegidos.length + 1;
    let pool = candidatos.filter((a) => !usados.has(a.id));
    if (lugar % 3 === 0) {
      const deMiProv = pool.filter((a) => a.p === E.prov);
      const deMiRegion = pool.filter((a) => r !== null && a.region === r);
      if (deMiProv.length) pool = deMiProv; else if (deMiRegion.length) pool = deMiRegion;
    }
    const tresIguales = elegidos.length >= 3 && elegidos.slice(-3).every((a) => a.m === elegidos[elegidos.length - 1].m);
    let elegido = pool.find((a) => !(tresIguales && a.m === elegidos[elegidos.length - 1].m)) || pool[0];
    elegidos.push(elegido); usados.add(elegido.id);
  }

}

  const reciente = acu[acu.length - 1];

function buscarDatosPersonales(texto) {

    const desde = m.index + m[0].lastIndexOf(m[2]); hallazgos.push({ tipo: 'dni', desde, hasta: desde + m[2].length });
  }
  for (const m of texto.matchAll(/\+?\(?\d[\d\s\-()]{6,18}\d/g)) {
    const digitos = m[0].replace(/\D/g, '').length;
    const tapado = hallazgos.some((h) => m.index < h.hasta && m.index + m[0].length > h.desde);
    if (digitos >= 8 && digitos <= 13 && !tapado) hallazgos.push({ tipo: 'telefono', desde: m.index, hasta: m.index + m[0].length });

}

async function dibujarImagen(lienzo) {
  const W = 1080, H = 1350; lienzo.width = W; lienzo.height = H;
  try { await Promise.all([document.fonts.load('80px Anton'), document.fonts.load('600 60px Archivo'), document.fonts.load('700 30px "Space Mono"')]); } catch (e) { /* sigue con lo que haya */ }
  const c = lienzo.getContext('2d');
  c.fillStyle = '#F2EFE7'; c.fillRect(0, 0, W, H);
  c.font = '600 64px Archivo, sans-serif';
  const renglones = partirEnRenglones('«' + E.linea + '»', (t) => c.measureText(t).width, 760).slice(0, 8);
  const alto = 250 + renglones.length * 82;
  const arriba = 90 + Math.max(0, (1010 - alto) / 2);
  c.save(); c.translate(W / 2, arriba + alto / 2); c.rotate(-0.012);
  c.fillStyle = '#FBFAF4'; c.fillRect(-430, -alto / 2, 860, alto);
  c.strokeStyle = '#D8D4C8'; c.lineWidth = 3; c.strokeRect(-430, -alto / 2, 860, alto); c.restore();
  c.fillStyle = '#6B665C'; c.font = '700 30px "Space Mono", monospace';
  c.fillText(('Alguien de ' + deDonde(E.prov === 'ninguna' ? null : E.prov) + ' imagina').toUpperCase(), 160, arriba + 90);
  c.fillStyle = '#16130E'; c.font = '600 64px Archivo, sans-serif';
  renglones.forEach((r, i) => c.fillText(r, 160, arriba + 190 + i * 82));
  const pieY = arriba + 190 + renglones.length * 82 + 10;
  c.fillStyle = '#5227CC'; c.fillRect(160, pieY - 18, 14, 14);
  c.fillStyle = '#6B665C'; c.font = '700 28px "Space Mono", monospace'; c.fillText((E.tema ? TEMA[E.tema] : 'Mi Argentina ideal').toUpperCase(), 188, pieY - 4);
  c.fillStyle = '#16130E'; c.font = '86px Anton, Impact, sans-serif'; c.fillText('¿Y VOS?', 120, 1200);
  c.font = '700 30px "Space Mono", monospace'; c.fillText('SUMÁ EL TUYO EN MI ARGENTINA IDEAL', 120, 1250);
  c.fillStyle = '#6B665C'; c.fillText('elinstantedelhombregris.com', 120, 1295);
  c.font = '64px Anton, Impact, sans-serif'; c.fillStyle = '#5227CC'; c.fillText('¡', 800, 1200); c.fillStyle = '#16130E'; c.fillText('BASTA', 822, 1200);
  c.fillStyle = '#5227CC'; c.fillText('!', 822 + c.measureText('BASTA').width, 1200);
}
function partirEnRenglones(texto, medir, ancho) {
  const palabras = texto.split(/\s+/); const renglones = []; let actual = '';
  for (const p of palabras) {
    const prueba = actual ? actual + ' ' + p : p;
    if (medir(prueba) <= ancho || !actual) actual = prueba; else { renglones.push(actual); actual = p; }
  }
  if (actual) renglones.push(actual);
  return renglones;
}

  /* La devolución, después de responder y nunca antes. */
  let msg = '';
  if (valor !== 'paso' && r !== null && antes === 4) msg = `Con tu respuesta, <strong>${esc(CON_ARTICULO[r])}</strong> ya cuenta en este aporte.`;
  else if (valor === 'acuerdo') { const k = a.acu.reduce((x, y) => x + y, 0); msg = k ? `Vos y ${k.toLocaleString('es-AR')} personas más.` : 'Sos de los primeros en verlo.'; }
  else if (valor === 'desacuerdo') { const k = a.n.reduce((x, y) => x + y, 0) - a.acu.reduce((x, y) => x + y, 0); msg = k ? `Vos y ${k.toLocaleString('es-AR')} personas más dijeron que no.` : 'Sos de los primeros en verlo.'; }
  E.ultimaDevolucion = msg;
  const dev = P.querySelector('#devolucion'); if (dev) dev.innerHTML = msg;
  const arriba = P.querySelector('#arriba');
  const sello = { acuerdo: '#s-si', desacuerdo: '#s-no', paso: '#s-paso' }[valor];
  const s = arriba && arriba.querySelector(sello); if (s) s.style.opacity = 1;
  if (arriba) {
    arriba.classList.remove('volviendo'); arriba.classList.add('volando');
    if (reducido.matches) arriba.style.opacity = 0;
    else {
      const dx = valor === 'acuerdo' ? 1 : valor === 'desacuerdo' ? -1 : 0;
      arriba.style.transform = `translate(${dx * 140}%, ${valor === 'paso' ? 120 : 8}%) rotate(${dx * 18}deg)`;
      arriba.style.opacity = 0;
    }
  }
  setTimeout(() => {
    E.idx += 1;
    /* ¿Cuál va primero? después de la 4.ª y la 8.ª respuesta. */
    if ((E.respondidasEnTanda === 4 || E.respondidasEnTanda === 8) && E.duelosEnTanda < 2) {
      const par = proximoDuelo();
      if (par) { E.tanda.splice(E.idx, 0, { tipo: 'duelo', par }); E.duelosEnTanda += 1; }
    }
    respondiendo = false;
    ir('mirar', { sinFoco: true });
    const nueva = P.querySelector('#arriba'); if (nueva) nueva.focus({ preventScroll: true });
  }, desdeArrastre ? 300 : 360);
}

function arrastre(el) {
  let x0 = 0, y0 = 0, dx = 0, dy = 0, activo = false, movio = false;
  const ss = el.querySelector('#s-si'), sn = el.querySelector('#s-no'), sp = el.querySelector('#s-paso');
  el.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 && e.pointerType === 'mouse') return;
    activo = true; movio = false; x0 = e.clientX; y0 = e.clientY; dx = dy = 0;
    el.setPointerCapture(e.pointerId); el.classList.add('arrastrando'); el.classList.remove('volviendo');
  });
  el.addEventListener('pointermove', (e) => {
    if (!activo) return;
    dx = e.clientX - x0; dy = e.clientY - y0;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) movio = true;
    el.style.transform = `translate(${dx}px, ${Math.max(0, dy) * 0.9}px) rotate(${dx / 18 + giro(el.dataset.id || '')}deg)`;
    ss.style.opacity = acotar(dx / 90, 0, 1); sn.style.opacity = acotar(-dx / 90, 0, 1);
    sp.style.opacity = Math.abs(dx) < 50 ? acotar(dy / 90, 0, 1) : 0;
  });
  const soltar = () => {
    if (!activo) return; activo = false; el.classList.remove('arrastrando');
    if (dx > 90) responder('acuerdo', true);
    else if (dx < -90) responder('desacuerdo', true);
    else if (dy > 90 && Math.abs(dx) < 60) responder('paso', true);
    else {
      el.classList.add('volviendo'); el.style.transform = ''; ss.style.opacity = 0; sn.style.opacity = 0; sp.style.opacity = 0;
      if (!movio) abrirDetalle(porId[E.tanda[E.idx].id]);
    }
  };
  el.addEventListener('pointerup', soltar);
  el.addEventListener('pointercancel', () => { activo = false; el.classList.add('volviendo'); el.style.transform = ''; ss.style.opacity = sn.style.opacity = sp.style.opacity = 0; });
}

function abrirDetalle(a) {
  const previo = document.activeElement;
  const velo = document.createElement('div'); velo.className = 'velo';
  velo.innerHTML = `<div class="hoja-inferior" role="dialog" aria-modal="true" aria-labelledby="detalle-h">
      <p class="kicker">Alguien de ${esc(deDonde(a.p))} imagina · ${esc(TEMA[a.m])}</p>
      <p id="detalle-h" class="linea" style="font-weight:560;font-size:22px;line-height:1.3">«${esc(a.t)}»</p>
      ${a.o ? `<div class="grupo"><p class="rotulo">Lo que escribió completo</p><p>${esc(a.o)}</p></div>` : '<p class="chico">Escribió sólo esta línea.</p>'}
      <div id="reporte" class="grupo">
        <button type="button" class="enlace" id="abrir-reporte">Reportar este aporte</button>
      </div>
      <button type="button" class="boton ancho" id="cerrar">Volver a la tarjeta</button>
    </div>`;
  document.body.appendChild(velo);
  const cerrar = () => { velo.remove(); document.removeEventListener('keydown', esc_); if (previo) previo.focus({ preventScroll: true }); };
  const esc_ = (e) => { if (e.key === 'Escape') cerrar(); };
  document.addEventListener('keydown', esc_);
  velo.addEventListener('click', (e) => { if (e.target === velo) cerrar(); });
  velo.querySelector('#cerrar').addEventListener('click', cerrar);
  velo.querySelector('#detalle-h').setAttribute('tabindex', '-1'); velo.querySelector('#detalle-h').focus();
  velo.querySelector('#abrir-reporte').addEventListener('click', () => {
    velo.querySelector('#reporte').innerHTML = `
      <fieldset class="grupo" style="border:0;padding:0;margin:0"><legend class="rotulo" style="margin-bottom:8px">¿Por qué no va?</legend>
        <div class="opciones">
          <label class="opcion"><input type="radio" name="motivo" value="insulta" /><span>Insulta a alguien</span></label>
          <label class="opcion"><input type="radio" name="motivo" value="datos" /><span>Tiene datos de una persona</span></label>
          <label class="opcion"><input type="radio" name="motivo" value="tema" /><span>No tiene que ver con la pregunta</span></label>
        </div></fieldset>
      <p class="error" id="error-motivo" role="alert"></p>
      <button type="button" class="boton principal ancho" id="enviar-reporte">Enviar reporte</button>
      <p class="chico">Con 13 reportes de personas que ya contestaron cinco aportes, sale de Mirar. Juan Bravin lo revisa y lo puede devolver.</p>`;
    velo.querySelector('#enviar-reporte').addEventListener('click', () => {
      const m = velo.querySelector('input[name="motivo"]:checked');
      if (!m) { velo.querySelector('#error-motivo').textContent = 'Elegí un motivo.'; return; }
      velo.querySelector('#reporte').innerHTML = '<p><strong>Gracias. Lo vamos a tener en cuenta.</strong></p><p class="chico">No te lo vamos a volver a mostrar.</p>';
      E.reportados.add(a.id);
      setTimeout(() => { cerrar(); E.idx += 1; E.ultimaDevolucion = ''; ir('mirar', { sinFoco: true }); }, 1100);
    });
  });
}

RENDER.fin = function () {
  const enTanda = E.tanda.filter((t) => t.tipo === 'aporte');
  const vistos = enTanda.filter((t) => E.resp[t.id] || E.reportados.has(t.id));
  const si = vistos.filter((t) => E.resp[t.id] === 'acuerdo').map((t) => porId[t.id]);
  P.innerHTML = `
    <p class="kicker">Mirar · listo</p>
    <h2>Listo. Miraste ${vistos.length}.</h2>
    <p class="bajada">${si.length ? `Dijiste yo también a ${si.length}:` : 'Esta vez no dijiste yo también a ninguno. Está bien: eso también cuenta.'}</p>
    ${si.length ? `<div>${si.map((a) => `<div class="fila"><p class="texto">«${esc(a.t)}»</p><p class="meta"><span>${esc(deDonde(a.p))}</span><span>${esc(TEMA[a.m])}</span></p></div>`).join('')}</div>` : ''}
    <button type="button" class="boton principal ancho" id="a-ver">Ver cómo se va armando →</button>
    <button type="button" class="boton ancho" id="otra">Otra tanda</button>
    ${E.publicado ? '' : '<button type="button" class="enlace" id="escribir">Escribir el mío</button>'}`;
  P.querySelector('#a-ver').addEventListener('click', () => ir('ver'));
  P.querySelector('#otra').addEventListener('click', () => nuevaTanda());
  const b = P.querySelector('#escribir'); if (b) b.addEventListener('click', () => ir('pregunta'));
};

/* ════════════════════ Ver ════════════════════ */
const GEO = JSON.parse(document.getElementById('geo').textContent);
function nivelDeLuz(nombre) {
  const p = PROV[nombre]; const gente = PARTICIPARON[nombre] + (E.publicado && E.prov === nombre ? 1 : 0);
  if (!gente) return 0;
  const cada100k = (gente / (p.pob * 1000)) * 100000;
  return 1 + Math.min(4, Math.floor(Math.pow(Math.min(1, cada100k / 15), 0.45) * 4.999));
}
RENDER.ver = function () {
  const lecturas = APORTES.filter((a) => !E.reportados.has(a.id)).map((a) => ({ a, l: lectura(a) }));
  const une = lecturas.filter((x) => x.l.une).sort((x, y) => y.l.peor - x.l.peor || y.l.c.total - x.l.c.total);
  const primero = lecturas.filter((x) => x.l.general >= 0.6 && comparaciones(x.a).comp >= 10)
    .map((x) => { const k = comparaciones(x.a); return { ...x, puntaje: (k.gana + 1) / (k.comp + 2), k }; })
    .sort((x, y) => y.puntaje - x.puntaje).slice(0, 5);
  const divide = lecturas.filter((x) => x.l.divide).sort((x, y) => (y.l.mejor - y.l.peor) - (x.l.mejor - x.l.peor));
  const recien = lecturas.filter((x) => !x.l.discute).sort((x, y) => x.l.c.total - y.l.c.total).slice(0, 3);
  const discutidos = lecturas.filter((x) => x.l.discute);
  const r = regionMia();
  const personas = POR_REGION.reduce((x, y) => x + y, 0) + (E.publicado || Object.keys(E.resp).length ? 1 : 0);
  const opiniones = lecturas.reduce((s, x) => s + x.l.c.total, 0);
  const provincias = PROVINCIAS.filter((p) => PARTICIPARON[p.nombre] > 0 || (E.publicado && E.prov === p.nombre)).length;
  const dias = Math.max(0, Math.ceil((new Date('2027-02-28T23:59:00-03:00') - new Date()) / 86400000));
  const puntos = (x) => `<span class="puntos" aria-label="${x.l.porRegion.map((v, i) => REGIONES[i] + ': ' + (v === null ? 'faltan opiniones' : deCadaDiez(v) + ' de cada 10')).join('; ')}">${x.l.porRegion.map((v) => `<span class="punto ${v === null ? 'falta' : v >= 0.7 ? 'lleno' : ''}"></span>`).join('')}</span>`;
  const miVoto = (a) => (E.resp[a.id] ? `<span>Vos: ${E.resp[a.id] === 'acuerdo' ? 'yo también' : E.resp[a.id] === 'desacuerdo' ? 'yo no' : 'pasaste'}</span>` : '');

  const temas = TEMAS.map(([k, l]) => { const top = une.find((x) => x.a.m === k); return [l, top]; });

  P.innerHTML = `
    <p class="kicker num">Mi Argentina ideal · edición 1 · faltan ${dias} días</p>
    <h1>La Argentina que estamos imaginando</h1>
    <div class="cifras">
      <div><p class="n">${personas.toLocaleString('es-AR')}</p><p class="rotulo">personas</p></div>
      <div><p class="n">${opiniones.toLocaleString('es-AR')}</p><p class="rotulo">opiniones</p></div>
      <div><p class="n">${provincias}<span style="font-size:18px"> de 24</span></p><p class="rotulo">provincias</p></div>
    </div>

    ${E.publicado && E.publicado.lectura === 'libre' ? `<section class="seccion" aria-labelledby="h-tuyo">
      <h2 id="h-tuyo">Tu aporte</h2>
      ${papelitoHTML({ id: 'tuyo', t: E.linea, p: E.prov, m: E.tema }, { quieto: true, clase: 'propio' })}
      <p class="chico">Todavía nadie lo vio. Como tiene menos opiniones que todos, va primero en la pila de los demás. Esto lo ves sólo vos.</p>
    </section>` : ''}

    <section class="seccion" aria-labelledby="h-une">
      <h2 id="h-une">Lo que nos une</h2>
      <p class="bajada">Lo que quiere la mayoría en cada región que opinó lo suficiente, no sólo en el total.</p>
      <p class="leyenda"><span><span class="punto lleno"></span>7 de cada 10 o más</span><span><span class="punto"></span>menos</span><span><span class="punto falta"></span>faltan opiniones</span><span>· NOA, NEA, Cuyo, Centro, Bs. As., Patagonia</span></p>
      <div>${une.slice(0, 6).map((x) => `<div class="fila">
        <p class="texto">«${esc(x.a.t)}»</p>
        <div class="barra-acuerdo umbral" aria-hidden="true"><i style="width:${Math.round(x.l.general * 100)}%"></i></div>
        <p class="meta num"><span>${deCadaDiez(x.l.general)} de cada 10 que opinaron · en la región donde menos, ${deCadaDiez(x.l.peor)}</span></p>
        <p class="meta">${puntos(x)}<span>${esc(TEMA[x.a.m])}</span>${miVoto(x.a)}</p></div>`).join('') || '<p class="chico">Todavía ningún aporte cumple la regla en todas las regiones.</p>'}</div>
      ${une.length > 6 ? `<p class="chico">Y ${une.length - 6} más que también cumplen la regla.</p>` : ''}
    </section>

    <section class="seccion" aria-labelledby="h-primero">
      <h2 id="h-primero">Lo que va primero</h2>
      <p class="bajada">Entre lo que se quiere, lo que la gente elige cuando tiene que ordenar.</p>
      <ol class="ranking">${primero.map((x) => `<li><div><p class="texto" style="font-weight:560;font-size:17px">«${esc(x.a.t)}»</p>
        <p class="chico num" style="margin-top:6px">Cuando se compara con otro que también se quiere, va primero ${deCadaDiez(x.puntaje)} de cada 10 veces · ${x.k.comp} comparaciones</p></div></li>`).join('')}</ol>
    </section>

    <section class="seccion" aria-labelledby="h-divide">
      <h2 id="h-divide">Donde no coincidimos</h2>
      <p class="bajada">Lo que parte al medio, o lo que en una región se quiere y en otra no.</p>
      <div>${divide.slice(0, 4).map((x) => {
        const v = x.l.porRegion; const conDato = v.map((y, i) => [y, i]).filter(([y]) => y !== null);
        const alto = conDato.reduce((m, q) => (q[0] > m[0] ? q : m)); const bajo = conDato.reduce((m, q) => (q[0] < m[0] ? q : m));
        return `<div class="fila">
          <p class="texto">«${esc(x.a.t)}»</p>
          <div class="regiones-mini" aria-label="${v.map((y, i) => REGIONES[i] + ': ' + (y === null ? 'faltan opiniones' : deCadaDiez(y) + ' de cada 10')).join('; ')}">${v.map((y, i) => `<div><span class="col ${y === null ? 'falta' : ''}">${y === null ? '' : `<i style="height:${Math.round(y * 100)}%"></i>`}</span><span>${REGION_CORTA[i]}</span></div>`).join('')}</div>
          <p class="meta num"><span>En ${esc(CON_ARTICULO[alto[1]])}, ${deCadaDiez(alto[0])} de cada 10. En ${esc(CON_ARTICULO[bajo[1]])}, ${deCadaDiez(bajo[0])}.</span>${miVoto(x.a)}</p></div>`; }).join('')}</div>
    </section>

    <section class="seccion" aria-labelledby="h-temas">
      <h2 id="h-temas">En cada tema</h2>
      <p class="bajada">El aporte que más se comparte en todo el país, tema por tema.</p>
      <div>${temas.map(([l, top]) => `<div class="tema-fila"><span class="rotulo">${esc(l)}</span>${top ? `<p>«${esc(top.a.t)}»</p>` : `<p class="vacio">Todavía ningún aporte de ${esc(l.toLowerCase())} se comparte en todo el país.</p>`}</div>`).join('')}</div>
    </section>

    <section class="seccion" aria-labelledby="h-falta">
      <h2 id="h-falta">El país que falta</h2>
      <p class="bajada">Una región cuenta en un aporte cuando tiene cinco opiniones de ahí. Se están discutiendo ${discutidos.length} aportes.</p>
      <div class="pais">
        <div class="mapa-caja">${mapaSVG()}</div>
        <p class="rampa" aria-hidden="true">Menos gente <i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i><i class="l5"></i> más gente, por habitante</p>
        <p class="chico" id="mapa-info" role="status">Tocá una provincia. Santa Cruz todavía no habló.</p>
        <div>${REGIONES.map((nombre, i) => {
          const k = discutidos.filter((x) => x.l.c.n[i] >= 5).length; const tuya = r === i;
          return `<div class="region${tuya ? ' tuya' : ''}">
            <div class="cabeza"><h3>${esc(nombre)}${tuya ? ' <span class="rotulo">· tu región</span>' : ''}</h3><span class="rotulo num">${POR_REGION[i] + (tuya && (E.publicado || Object.keys(E.resp).length) ? 1 : 0)} personas</span></div>
            <div class="barra-region" aria-hidden="true"><i style="width:${discutidos.length ? Math.round((k / discutidos.length) * 100) : 0}%"></i></div>
            <p class="chico num">Ya cuenta en ${k} de los ${discutidos.length} aportes que se están discutiendo.</p>
            ${tuya && k < discutidos.length ? `<button type="button" class="boton principal ancho" data-completar="${i}">Completar los ${esc(DE_REGION[i])}</button>` : ''}
          </div>`; }).join('')}</div>
        ${r === null ? '<button type="button" class="enlace" id="decir-prov">Decir de qué provincia soy, para ver dónde falta mi respuesta</button>' : ''}
      </div>
    </section>

    <section class="seccion" aria-labelledby="h-recien">
      <h2 id="h-recien">Lo que recién llega</h2>
      <p class="bajada">Todavía tienen pocas opiniones. Sin las tuyas, no pueden entrar en la visión.</p>
      <div>${recien.map((x) => `<div class="fila"><p class="texto">«${esc(x.a.t)}»</p><p class="meta num"><span>${x.l.c.total} opiniones</span><span>${esc(TEMA[x.a.m])}</span></p></div>`).join('')}</div>
      <button type="button" class="boton ancho" id="mirarlos">Mirarlos</button>
    </section>

    <section class="pie-honesto">
      <p><strong>Esto es lo que dijeron quienes participaron. No es una encuesta del país.</strong></p>
      <p class="chico">Una persona decidida puede responder desde dos teléfonos. Esto mide a quienes participaron, no a la Argentina.</p>
      <details class="desplegable"><summary>Cómo se cuenta</summary>
        <div class="grupo chico">
          <p>Un aporte entra en la visión con al menos 20 opiniones («Yo también» o «Yo no») y al menos dos regiones con cinco o más.</p>
          <p>«Lo que nos une» pide 7 de cada 10 en cada una de esas regiones, y se ordena por la región donde el aporte anda peor.</p>
          <p>«Lo que va primero» cuenta cuántas veces se elige un aporte cuando se lo compara con otro que también se quiere. Al puntaje se le suma uno arriba y dos abajo, para que dos comparaciones ganadas no encabecen la lista.</p>
          <p>Los «Paso» se cuentan, pero no entran en los porcentajes. Una región con menos de cinco opiniones en un aporte no muestra porcentaje.</p>
          <p>Las regiones son NOA, NEA, Cuyo, Centro (con La Pampa), Buenos Aires (provincia y Ciudad) y Patagonia.</p>
        </div></details>
    </section>`;

  P.querySelectorAll('[data-completar]').forEach((b) => b.addEventListener('click', () => empezarMirar(Number(b.dataset.completar))));
  const dp = P.querySelector('#decir-prov'); if (dp) dp.addEventListener('click', () => { E.provPreguntada = false; E.prov = ''; E.tanda = []; ir('provincia'); });
  P.querySelector('#mirarlos').addEventListener('click', () => { E.tanda = []; empezarMirar(); });
  P.querySelectorAll('.mapa path').forEach((p) => {
    const elegir = () => {
      P.querySelectorAll('.mapa path').forEach((q) => q.classList.toggle('elegida', q === p));
      const nombre = p.dataset.nombre; const prov = PROV[nombre];
      const gente = PARTICIPARON[nombre] + (E.publicado && E.prov === nombre ? 1 : 0);
      const reg = prov.region; const k = discutidos.filter((x) => x.l.c.n[reg] >= 5).length;
      P.querySelector('#mapa-info').textContent = gente
        ? `${nombre === 'Ciudad Autónoma de Buenos Aires' ? 'Ciudad de Buenos Aires' : nombre}: ${gente} personas, ${((gente / (prov.pob * 1000)) * 100000).toLocaleString('es-AR', { maximumFractionDigits: 1 })} cada 100.000. ${REGIONES[reg]} ya cuenta en ${k} de ${discutidos.length}.`
        : `${nombre}: todavía nadie. El silencio también es un dato.`;
    };
    p.addEventListener('click', elegir);
    p.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); elegir(); } });
  });
};

function mapaSVG() {
  return `<svg class="mapa" viewBox="0 0 166 340" role="group" aria-label="Mapa de la Argentina: provincias encendidas según cuánta gente participó por habitante">
    ${GEO.map((g) => { const nivel = nivelDeLuz(g.n); return `<path d="${g.d}" class="l${nivel}${nivel === 0 ? ' muda' : ''}" data-nombre="${esc(g.n)}" tabindex="0" role="button" aria-label="${esc(g.n)}"></path>`; }).join('')}
  </svg>`;
}
