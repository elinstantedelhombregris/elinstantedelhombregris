<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Diseñá tu propia universidad en noventa días</title><desc id="desc">Cinco pasos para elegir un sistema, mapear habilidades, construir una red de aprendizaje, practicar y enseñar lo aprendido.</desc>
  <defs><pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#17131d" opacity=".15"/></pattern></defs>
  <rect width="1200" height="720" fill="#f2eadb"/><text fill="#17131d" font-family="Arial,sans-serif" font-size="31" font-weight="700"><tspan x="60" y="58">TU UNIVERSIDAD EMPIEZA EN EL PROBLEMA</tspan><tspan x="60" y="92">QUE DECIDISTE TOCAR.</tspan></text><text x="60" y="126" fill="#525a61" font-family="Arial,sans-serif" font-size="19">Noventa días · una capacidad observable · práctica real · conocimiento compartido.</text>
  <path d="M110 330H1090" stroke="#525a61" stroke-width="7"/><g font-family="Arial,sans-serif" text-anchor="middle">
    <g><circle cx="130" cy="330" r="58" fill="#a72c35" stroke="#17131d" stroke-width="4"/><text x="130" y="341" fill="#f2eadb" font-size="30" font-weight="700">1</text><text x="130" y="430" fill="#17131d" font-size="20" font-weight="700">SISTEMA</text><text x="130" y="460" fill="#525a61" font-size="16">¿qué querés rediseñar?</text></g>
    <g><circle cx="365" cy="330" r="58" fill="#d6d8d7" stroke="#17131d" stroke-width="4"/><text x="365" y="341" fill="#17131d" font-size="30" font-weight="700">2</text><text x="365" y="430" fill="#17131d" font-size="20" font-weight="700">5 HABILIDADES</text><text x="365" y="460" fill="#525a61" font-size="16">palancas, no credenciales</text></g>
    <g><circle cx="600" cy="330" r="58" fill="url(#dots)" stroke="#17131d" stroke-width="4"/><text x="600" y="341" fill="#17131d" font-size="30" font-weight="700">3</text><text x="600" y="430" fill="#17131d" font-size="20" font-weight="700">RED</text><text x="600" y="460" fill="#525a61" font-size="16">mentor · libro · comunidad</text></g>
    <g><circle cx="835" cy="330" r="58" fill="#aeb4b7" stroke="#17131d" stroke-width="4"/><text x="835" y="341" fill="#17131d" font-size="30" font-weight="700">4</text><text x="835" y="430" fill="#17131d" font-size="20" font-weight="700">PRÁCTICA</text><text x="835" y="460" fill="#525a61" font-size="16">un resultado verificable</text></g>
    <g><circle cx="1070" cy="330" r="58" fill="#525a61" stroke="#17131d" stroke-width="4"/><text x="1070" y="341" fill="#f2eadb" font-size="30" font-weight="700">5</text><text x="1070" y="430" fill="#17131d" font-size="20" font-weight="700">ENSEÑAR</text><text x="1070" y="460" fill="#525a61" font-size="16">probar qué entendiste</text></g>
  </g>
  <g font-family="Arial,sans-serif" font-weight="700"><text x="60" y="550" fill="#17131d" font-size="20">SPRINT DE 90 DÍAS</text><rect x="60" y="578" width="360" height="62" fill="#17131d"/><rect x="420" y="578" width="360" height="62" fill="#aeb4b7"/><rect x="780" y="578" width="360" height="62" fill="#a72c35"/><text x="240" y="617" text-anchor="middle" fill="#f2eadb" font-size="18">DÍAS 1–30 · EXPLORAR</text><text x="600" y="617" text-anchor="middle" fill="#17131d" font-size="18">DÍAS 31–60 · PRACTICAR</text><text x="960" y="617" text-anchor="middle" fill="#f2eadb" font-size="18">DÍAS 61–90 · DEMOSTRAR</text></g>
</svg>
