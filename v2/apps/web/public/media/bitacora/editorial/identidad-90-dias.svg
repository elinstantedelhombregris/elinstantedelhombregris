<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900" role="img" aria-labelledby="title desc">
  <title id="title">Una prueba acotada de noventa días</title>
  <desc id="desc">Calendario propuesto, no resultado observado. Días 1 a 14: acordar pregunta, recursos y límites. Días 15 a 60: probar y recibir objeciones sin represalias. Días 61 a 90: revisar resultados y costos, y decidir si continuar, modificar o terminar. Las tres etapas se destacan una sola vez; todos sus textos son siempre visibles. Las tarjetas no representan duraciones a escala.</desc>
  <style>
    text{font-family:Arial,sans-serif;fill:#17131d}.k{font-family:monospace;font-size:21px;letter-spacing:2px}.h{font-size:43px;font-weight:700}.b{font-size:30px;font-weight:700}.s{font-size:26px;fill:#4d4547}.accent{fill:#a72c35}.bar{fill:#a72c35;opacity:.2;animation:focus 1.1s ease-in-out both}.b2{animation-delay:1.1s}.b3{animation-delay:2.2s}@keyframes focus{0%,100%{opacity:.2}45%{opacity:1}}@media(prefers-reduced-motion:reduce){.bar{animation:none}}
  </style>
  <rect width="720" height="900" fill="#f2eadb"/>
  <text x="38" y="47" class="k">03 / CALENDARIO PROPUESTO</text><text x="38" y="110" class="h">PROBAR TAMBIÉN</text><text x="38" y="159" class="h">ES PODER PARAR</text>
  <g stroke="#17131d" stroke-width="2" fill="#eee4d3"><rect x="38" y="197" width="644" height="155"/><rect x="38" y="378" width="644" height="155"/><rect x="38" y="559" width="644" height="155"/></g>
  <rect class="bar" x="38" y="197" width="8" height="155"/><rect class="bar b2" x="38" y="378" width="8" height="155"/><rect class="bar b3" x="38" y="559" width="8" height="155"/>
  <text x="63" y="238" class="k accent">DÍAS 1–14 / ACORDAR</text><text x="63" y="282" class="b">¿Qué queremos cambiar?</text><text x="63" y="322" class="s">Pregunta, recursos, referencia y límites.</text>
  <text x="63" y="419" class="k accent">DÍAS 15–60 / PROBAR</text><text x="63" y="463" class="b">¿A quién le cuesta esta prueba?</text><text x="63" y="503" class="s">Escuchar objeciones. Corregir a tiempo.</text>
  <text x="63" y="600" class="k accent">DÍAS 61–90 / REVISAR</text><text x="63" y="644" class="b">¿Qué aprendimos?</text><text x="63" y="684" class="s">Continuar, modificar o terminar.</text>
  <path d="M360 352V378M360 533V559" stroke="#17131d" stroke-width="2"/>
  <path d="M38 757H682" stroke="#17131d" stroke-width="2"/>
  <text x="38" y="801" class="s">Sin recursos y capacidad de respuesta,</text><text x="38" y="840" class="s">todavía es una propuesta por preparar.</text>
  <text x="38" y="879" class="k">EL CALENDARIO NO GARANTIZA RESULTADOS.</text>
</svg>
