<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Auditoría de parámetros personales</title><desc id="desc">Cinco pruebas para evaluar si un parámetro es propio, vivible, orientado a la vida, compatible con el bien de otros y revisable.</desc>
  <rect width="1200" height="720" fill="#f2eadb"/><text x="60" y="76" fill="#17131d" font-family="Arial,sans-serif" font-size="35" font-weight="700">ANTES DE CUMPLIR LA VARA, AUDITÁ QUIÉN LA PUSO</text><text x="60" y="112" fill="#525a61" font-family="Arial,sans-serif" font-size="20">Un parámetro sano no se reconoce por lo noble que suena, sino por cómo está diseñado.</text>
  <g font-family="Arial,sans-serif"><g stroke="#17131d" stroke-width="3">
    <rect x="60" y="165" width="210" height="330" fill="#a72c35"/><rect x="277" y="165" width="210" height="330" fill="#d6d8d7"/><rect x="494" y="165" width="210" height="330" fill="#aeb4b7"/><rect x="711" y="165" width="210" height="330" fill="#525a61"/><rect x="928" y="165" width="212" height="330" fill="#17131d"/>
  </g><g font-weight="700"><text x="82" y="210" fill="#f2eadb" font-size="18">01 · ES MÍO</text><text x="82" y="258" fill="#f2eadb" font-size="24">¿Lo elegí</text><text x="82" y="288" fill="#f2eadb" font-size="24">con los ojos</text><text x="82" y="318" fill="#f2eadb" font-size="24">abiertos?</text><text x="82" y="450" fill="#f2eadb" font-size="16">origen visible</text>
    <text x="299" y="210" fill="#a72c35" font-size="18">02 · ES VIVIBLE</text><text x="299" y="258" fill="#17131d" font-size="24">¿Existe un</text><text x="299" y="288" fill="#17131d" font-size="24">punto llamado</text><text x="299" y="318" fill="#17131d" font-size="24">“suficiente”?</text><text x="299" y="450" fill="#525a61" font-size="16">sin destruirte</text>
    <text x="516" y="210" fill="#a72c35" font-size="18">03 · MIDE VIDA</text><text x="516" y="258" fill="#17131d" font-size="24">¿Mide la cosa</text><text x="516" y="288" fill="#17131d" font-size="24">o su imagen</text><text x="516" y="318" fill="#17131d" font-size="24">ante otros?</text><text x="516" y="450" fill="#17131d" font-size="16">realidad, no reflejo</text>
    <text x="733" y="210" fill="#f2eadb" font-size="18">04 · DEJA LUGAR</text><text x="733" y="258" fill="#f2eadb" font-size="24">¿Puede cumplirse</text><text x="733" y="288" fill="#f2eadb" font-size="24">sin que otro</text><text x="733" y="318" fill="#f2eadb" font-size="24">pierda?</text><text x="733" y="450" fill="#f2eadb" font-size="16">no suma cero</text>
    <text x="950" y="210" fill="#f2eadb" font-size="18">05 · ES REVISABLE</text><text x="950" y="258" fill="#f2eadb" font-size="24">¿Puedo cambiarlo</text><text x="950" y="288" fill="#f2eadb" font-size="24">cuando la vida</text><text x="950" y="318" fill="#f2eadb" font-size="24">trae evidencia?</text><text x="950" y="450" fill="#aeb4b7" font-size="16">hipótesis, no dogma</text></g>
  <text x="60" y="565" fill="#17131d" font-size="21" font-weight="700">REVISIÓN SEMANAL</text><rect x="60" y="592" width="1080" height="70" fill="none" stroke="#a72c35" stroke-width="4"/><text x="90" y="635" fill="#525a61" font-size="20">¿Qué vara me gobernó esta semana? · ¿Qué produjo? · ¿La conservo, la recalibro o la apago?</text></g>
</svg>
