<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo para refinar sin repetir</title><desc id="desc">Una espiral de supuesto, prototipo, uso real, evidencia, sustracción y nueva versión que conserva propósito y actualiza estructura.</desc>
  <rect width="1200" height="720" fill="#f2eadb"/><text fill="#17131d" font-family="Arial,sans-serif" font-size="31" font-weight="700"><tspan x="60" y="58">LA VISIÓN SE CONSERVA MEJOR</tspan><tspan x="60" y="92">CUANDO LA FORMA PUEDE CAMBIAR.</tspan></text><text x="60" y="126" fill="#525a61" font-family="Arial,sans-serif" font-size="19">Una vuelta repite. Una espiral regresa con evidencia y menos ego adherido.</text>
  <path d="M600 370c0-70 95-85 125-25 45 90-70 175-175 125-150-72-105-280 75-315 235-45 390 185 270 385-105 175-390 160-520-45" fill="none" stroke="#a72c35" stroke-width="8" stroke-dasharray="16 10"/>
  <g font-family="Arial,sans-serif" text-anchor="middle"><g stroke="#17131d" stroke-width="4"><circle cx="600" cy="370" r="70" fill="#17131d"/><circle cx="765" cy="275" r="70" fill="#d6d8d7"/><circle cx="880" cy="430" r="70" fill="#aeb4b7"/><circle cx="700" cy="590" r="70" fill="#525a61"/><circle cx="420" cy="535" r="70" fill="#d6d8d7"/><circle cx="305" cy="285" r="70" fill="#a72c35"/></g>
    <text x="600" y="362" fill="#f2eadb" font-size="18" font-weight="700">SUPUESTO</text><text x="600" y="390" fill="#aeb4b7" font-size="14">“creemos que...”</text><text x="765" y="267" fill="#17131d" font-size="18" font-weight="700">PROTOTIPO</text><text x="765" y="295" fill="#525a61" font-size="14">versión mínima</text><text x="880" y="422" fill="#17131d" font-size="18" font-weight="700">USO REAL</text><text x="880" y="450" fill="#17131d" font-size="14">persona + contexto</text><text x="700" y="582" fill="#f2eadb" font-size="18" font-weight="700">EVIDENCIA</text><text x="700" y="610" fill="#f2eadb" font-size="14">resultado + fricción</text><text x="420" y="527" fill="#17131d" font-size="18" font-weight="700">QUITAR</text><text x="420" y="555" fill="#525a61" font-size="14">lo que no sirve</text><text x="305" y="277" fill="#f2eadb" font-size="18" font-weight="700">ACTUALIZAR</text><text x="305" y="305" fill="#f2eadb" font-size="14">nueva versión</text>
  </g><g font-family="Arial,sans-serif"><text x="60" y="690" fill="#17131d" font-size="17" font-weight="700">PREGUNTA DE CORTE:</text><text x="265" y="690" fill="#525a61" font-size="17">si quitamos esta pieza, ¿el propósito se debilita o solo se siente menos nuestro?</text></g>
</svg>
