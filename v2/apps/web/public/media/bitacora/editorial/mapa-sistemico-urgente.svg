<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Mapa sistémico urgente</title><desc id="desc">Tres lentes para reconocer refuerzo, balance y retrasos, seguidos por cuatro pasos para mapear actores, flujos, palancas y reglas.</desc>
  <rect width="1200" height="720" fill="#f2eadb"/><text x="60" y="76" fill="#17131d" font-family="Arial,sans-serif" font-size="35" font-weight="700">VER EL BUCLE ANTES DE ELEGIR LA PALANCA</text><text x="60" y="112" fill="#525a61" font-family="Arial,sans-serif" font-size="20">Un síntoma aislado pide reacción. Un patrón en el tiempo permite diseñar.</text>
  <g font-family="Arial,sans-serif"><text x="60" y="165" fill="#17131d" font-size="20" font-weight="700">TRES LENTES</text><g text-anchor="middle" stroke="#17131d" stroke-width="3"><circle cx="220" cy="300" r="105" fill="#a72c35"/><circle cx="600" cy="300" r="105" fill="#d6d8d7"/><circle cx="980" cy="300" r="105" fill="#525a61"/></g>
    <g text-anchor="middle" font-weight="700"><text x="220" y="285" fill="#f2eadb" font-size="23">REFUERZO</text><text x="220" y="320" fill="#f2eadb" font-size="16">cada vuelta amplifica</text><text x="600" y="285" fill="#17131d" font-size="23">BALANCE</text><text x="600" y="320" fill="#525a61" font-size="16">el sistema resiste el cambio</text><text x="980" y="285" fill="#f2eadb" font-size="23">RETRASO</text><text x="980" y="320" fill="#f2eadb" font-size="16">la causa llega antes del efecto</text></g>
    <text x="60" y="465" fill="#17131d" font-size="20" font-weight="700">CUATRO MOVIMIENTOS</text><g font-weight="700" text-anchor="middle"><rect x="60" y="495" width="250" height="120" fill="#17131d"/><rect x="337" y="495" width="250" height="120" fill="#aeb4b7"/><rect x="614" y="495" width="250" height="120" fill="#d6d8d7"/><rect x="891" y="495" width="249" height="120" fill="none" stroke="#a72c35" stroke-width="4"/><text x="185" y="545" fill="#f2eadb" font-size="19">1 · ACTORES</text><text x="185" y="577" fill="#aeb4b7" font-size="15">quién gana · pierde · decide</text><text x="462" y="545" fill="#17131d" font-size="19">2 · FLUJOS</text><text x="462" y="577" fill="#17131d" font-size="15">dinero · datos · emoción · poder</text><text x="739" y="545" fill="#17131d" font-size="19">3 · PALANCA</text><text x="739" y="577" fill="#525a61" font-size="15">cambio pequeño · efecto amplio</text><text x="1015" y="545" fill="#a72c35" font-size="19">4 · REGLA</text><text x="1015" y="577" fill="#525a61" font-size="15">nuevo incentivo explícito</text></g>
  </g><text x="60" y="676" fill="#525a61" font-family="Arial,sans-serif" font-size="20">Hipótesis útil = explica el patrón + anticipa un efecto + admite una prueba.</text>
</svg>
