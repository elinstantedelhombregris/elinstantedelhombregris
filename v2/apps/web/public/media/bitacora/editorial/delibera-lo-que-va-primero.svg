<svg xmlns="http://www.w3.org/2000/svg" width="720" height="860" viewBox="0 0 720 860" role="img" aria-labelledby="title desc">
  <title id="title">Lo que va primero: el orden en que se construye un país</title>
  <desc id="desc">Cinco hiladas apiladas como cimientos, de abajo hacia arriba. En la base, la más ancha y en rojo: amor y buena voluntad, querer el bien del otro. Encima, confianza, de fides, fe. Encima, crédito, de credere, creer. Encima, vínculos, de vinculum, lo que ata. Arriba de todo, la más angosta: todo lo demás, moneda, justicia, escuela, trabajo. Una flecha al costado indica que se construye de abajo hacia arriba.</desc>
  <defs>
    <marker id="fl" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#a72c35"/></marker>
  </defs>
  <style>
    text{font-family:Arial,sans-serif;fill:#17131d}
    .k{font-family:monospace;letter-spacing:2px;font-size:20px;fill:#525a61}
    .h{font-size:42px;font-weight:700}
    .s{font-size:22px;fill:#4d4547}
    .lab{font-size:25px;font-weight:700}
    .m{font-family:monospace;font-size:16px}
    .c{fill:#f2eadb}
    .hil{animation:subir .5s ease-out both}
    .h2{animation-delay:.45s}.h3{animation-delay:.9s}.h4{animation-delay:1.35s}.h5{animation-delay:1.8s}
    @keyframes subir{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @media(prefers-reduced-motion:reduce){.hil{animation:none}}
  </style>
  <rect width="720" height="860" fill="#f2eadb"/>
  <text x="38" y="48" class="k">04 / CIMIENTOS</text>
  <text x="38" y="106" class="h">LO QUE VA PRIMERO</text>
  <text x="38" y="146" class="s">el orden en que se construye un país</text>

  <!-- 5: todo lo demás -->
  <g class="hil h5">
    <rect x="184" y="196" width="400" height="96" fill="#eee4d3" stroke="#17131d" stroke-width="2"/>
    <text x="384" y="238" text-anchor="middle" class="lab">TODO LO DEMÁS</text>
    <text x="384" y="268" text-anchor="middle" class="m">moneda · justicia · escuela · trabajo</text>
  </g>
  <!-- 4: vínculos -->
  <g class="hil h4">
    <rect x="159" y="300" width="450" height="96" fill="#eee4d3" stroke="#17131d" stroke-width="2"/>
    <text x="384" y="342" text-anchor="middle" class="lab">VÍNCULOS</text>
    <text x="384" y="372" text-anchor="middle" class="m">vinculum: lo que ata</text>
  </g>
  <!-- 3: crédito -->
  <g class="hil h3">
    <rect x="134" y="404" width="500" height="96" fill="#d6d8d7" stroke="#17131d" stroke-width="2"/>
    <text x="384" y="446" text-anchor="middle" class="lab">CRÉDITO</text>
    <text x="384" y="476" text-anchor="middle" class="m">credere: creer</text>
  </g>
  <!-- 2: confianza -->
  <g class="hil h2">
    <rect x="109" y="508" width="550" height="96" fill="#17131d"/>
    <text x="384" y="550" text-anchor="middle" class="lab c">CONFIANZA</text>
    <text x="384" y="580" text-anchor="middle" class="m c">fides: fe</text>
  </g>
  <!-- 1: amor y buena voluntad -->
  <g class="hil">
    <rect x="84" y="612" width="600" height="104" fill="#a72c35"/>
    <text x="384" y="656" text-anchor="middle" class="lab c">AMOR Y BUENA VOLUNTAD</text>
    <text x="384" y="688" text-anchor="middle" class="m c">bene volens: el que quiere el bien del otro</text>
  </g>

  <!-- flecha -->
  <line x1="58" y1="706" x2="58" y2="212" stroke="#a72c35" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#fl)"/>
  <text x="46" y="470" class="m" style="fill:#a72c35" transform="rotate(-90 46 470)" text-anchor="middle">se construye de abajo hacia arriba</text>

  <line x1="38" y1="752" x2="682" y2="752" stroke="#17131d" stroke-width="2"/>
  <text x="38" y="794" style="font-size:22px;font-weight:700">Llevamos décadas empezando por arriba.</text>
  <text x="38" y="830" class="s" style="font-size:17px">Ilustrativo: un orden propuesto, no una medición.</text>
</svg>
