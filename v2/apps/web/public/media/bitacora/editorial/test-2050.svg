<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Prueba de una decisión ante la generación de 2050</title><desc id="desc">Tres principios de pensamiento de catedral, métricas de legado y puentes de conocimiento aplicados a una decisión presente.</desc>
  <rect width="1200" height="720" fill="#f2eadb"/><text fill="#17131d" font-family="Arial,sans-serif" font-size="31" font-weight="700"><tspan x="60" y="58">LA PERSONA QUE VA A VIVIR TU DECISIÓN</tspan><tspan x="60" y="92">TODAVÍA NO PUEDE APELAR.</tspan></text><text x="60" y="126" fill="#525a61" font-family="Arial,sans-serif" font-size="19">Traerla a la mesa cambia el horizonte, la métrica y la obligación de documentar.</text>
  <g font-family="Arial,sans-serif"><g stroke="#17131d" stroke-width="4"><rect x="60" y="175" width="330" height="300" fill="#17131d"/><rect x="435" y="175" width="330" height="300" fill="#aeb4b7"/><rect x="810" y="175" width="330" height="300" fill="#a72c35"/></g>
    <text x="90" y="225" fill="#f2eadb" font-size="19" font-weight="700">1 · PENSAMIENTO DE CATEDRAL</text><text x="90" y="282" fill="#f2eadb" font-size="25" font-weight="700">¿El valor excede</text><text x="90" y="315" fill="#f2eadb" font-size="25" font-weight="700">mi propio rol?</text><text x="90" y="400" fill="#aeb4b7" font-size="16">construir sin poseer el final</text>
    <text x="465" y="225" fill="#a72c35" font-size="19" font-weight="700">2 · MÉTRICA DE LEGADO</text><text x="465" y="282" fill="#17131d" font-size="25" font-weight="700">¿Sigue sirviendo</text><text x="465" y="315" fill="#17131d" font-size="25" font-weight="700">dentro de 20 años?</text><text x="465" y="400" fill="#17131d" font-size="16">resultado + daño acumulado</text>
    <text x="840" y="225" fill="#f2eadb" font-size="19" font-weight="700">3 · PUENTE DE CONOCIMIENTO</text><text x="840" y="282" fill="#f2eadb" font-size="25" font-weight="700">¿Puede continuar</text><text x="840" y="315" fill="#f2eadb" font-size="25" font-weight="700">sin nosotros?</text><text x="840" y="400" fill="#f2eadb" font-size="16">mentoría + memoria + relevo</text>
  </g><g font-family="Arial,sans-serif"><text x="60" y="535" fill="#17131d" font-size="20" font-weight="700">CARTA DE UNA PÁGINA AL 2050</text><rect x="60" y="565" width="1080" height="100" fill="none" stroke="#17131d" stroke-width="3"/><text x="90" y="607" fill="#525a61" font-size="19">No describas el país que deseás. Describí qué decisión concreta estás tomando para alguien que no podrá agradecerte.</text><text x="90" y="640" fill="#a72c35" font-size="19" font-weight="700">Si no podés explicar qué construís hoy, el futuro sigue siendo una coartada.</text></g>
</svg>
