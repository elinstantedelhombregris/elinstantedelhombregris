<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Blueprint de la amabilidad como infraestructura</title><desc id="desc">Cuatro momentos de una interacción amable y tres capas donde la práctica se convierte en cultura.</desc>
  <rect width="1200" height="720" fill="#f2eadb"/><text fill="#17131d" font-family="Arial,sans-serif" font-size="31" font-weight="700"><tspan x="60" y="58">UNA INTERACCIÓN CAMBIA PERCEPCIÓN.</tspan><tspan x="60" y="92">UNA REGLA CAMBIA CULTURA.</tspan></text><text x="60" y="126" fill="#525a61" font-family="Arial,sans-serif" font-size="19">El gesto aislado es valioso; el diseño repetible lo convierte en infraestructura.</text>
  <g font-family="Arial,sans-serif"><text x="60" y="165" fill="#17131d" font-size="20" font-weight="700">BLUEPRINT DE UNA INTERACCIÓN</text><g text-anchor="middle" font-weight="700"><rect x="60" y="190" width="250" height="155" fill="#17131d"/><rect x="337" y="190" width="250" height="155" fill="#d6d8d7"/><rect x="614" y="190" width="250" height="155" fill="#aeb4b7"/><rect x="891" y="190" width="249" height="155" fill="#a72c35"/><text x="185" y="240" fill="#f2eadb" font-size="19">1 · PREPARAR</text><text x="185" y="280" fill="#aeb4b7" font-size="16">emoción deseada</text><text x="462" y="240" fill="#17131d" font-size="19">2 · RECONOCER</text><text x="462" y="280" fill="#525a61" font-size="16">validar antes de pedir</text><text x="739" y="240" fill="#17131d" font-size="19">3 · OFRECER</text><text x="739" y="280" fill="#17131d" font-size="16">valor claro para el otro</text><text x="1015" y="240" fill="#f2eadb" font-size="19">4 · CERRAR</text><text x="1015" y="280" fill="#f2eadb" font-size="16">agradecimiento concreto</text></g>
  <text x="60" y="410" fill="#17131d" font-size="20" font-weight="700">TRES CAPAS DE APLICACIÓN</text><g stroke="#17131d" stroke-width="4"><rect x="60" y="438" width="330" height="180" fill="#d6d8d7"/><rect x="435" y="438" width="330" height="180" fill="#aeb4b7"/><rect x="810" y="438" width="330" height="180" fill="#525a61"/></g><g font-weight="700"><text x="85" y="483" fill="#a72c35" font-size="19">INDIVIDUAL</text><text x="85" y="525" fill="#17131d" font-size="23">límite firme</text><text x="85" y="558" fill="#525a61" font-size="16">comunicado con respeto</text><text x="460" y="483" fill="#a72c35" font-size="19">ORGANIZACIONAL</text><text x="460" y="525" fill="#17131d" font-size="23">ritual visible</text><text x="460" y="558" fill="#17131d" font-size="16">regla que reconoce cooperación</text><text x="835" y="483" fill="#f2eadb" font-size="19">COMUNITARIA</text><text x="835" y="525" fill="#f2eadb" font-size="23">espacio seguro</text><text x="835" y="558" fill="#f2eadb" font-size="16">desconocidos pueden colaborar</text></g></g>
  <text x="60" y="678" fill="#525a61" font-family="Arial,sans-serif" font-size="20">Percepción → velocidad del acuerdo → memoria colectiva.</text>
</svg>
