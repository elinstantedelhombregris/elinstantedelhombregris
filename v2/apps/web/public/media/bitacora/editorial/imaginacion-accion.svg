<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">De la imaginación a una primera acción</title><desc id="desc">Método de silencio, pregunta precisa, visualización sostenida y acción dentro de las siguientes veinticuatro horas.</desc>
  <rect width="1200" height="720" fill="#f2eadb"/><text fill="#17131d" font-family="Arial,sans-serif" font-size="31" font-weight="700"><tspan x="60" y="58">LA IMAGINACIÓN SIN ACCIÓN ES FANTASÍA.</tspan><tspan x="60" y="92">LA ACCIÓN SIN VISIÓN REPITE.</tspan></text><text x="60" y="126" fill="#525a61" font-family="Arial,sans-serif" font-size="19">La facultad creadora se entrena con una secuencia concreta.</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><g stroke="#17131d" stroke-width="4"><rect x="60" y="180" width="245" height="300" fill="#17131d"/><rect x="338" y="180" width="245" height="300" fill="#d6d8d7"/><rect x="616" y="180" width="245" height="300" fill="#aeb4b7"/><rect x="894" y="180" width="246" height="300" fill="#a72c35"/></g>
    <text x="182" y="230" fill="#f2eadb" font-size="19" font-weight="700">1 · SILENCIO</text><text x="182" y="285" fill="#f2eadb" font-size="25" font-weight="700">hacer espacio</text><text x="182" y="320" fill="#aeb4b7" font-size="16">menos ruido prestado</text><text x="182" y="410" fill="#f2eadb" font-size="16">10 minutos sin entrada</text>
    <text x="460" y="230" fill="#a72c35" font-size="19" font-weight="700">2 · PREGUNTA</text><text x="460" y="285" fill="#17131d" font-size="25" font-weight="700">precisa y viva</text><text x="460" y="320" fill="#525a61" font-size="16">resultado + persona + límite</text><text x="460" y="410" fill="#17131d" font-size="16">una pregunta, varios días</text>
    <text x="738" y="230" fill="#a72c35" font-size="19" font-weight="700">3 · VISIÓN</text><text x="738" y="285" fill="#17131d" font-size="25" font-weight="700">sostenida</text><text x="738" y="320" fill="#17131d" font-size="16">detalle · prueba mental · ajuste</text><text x="738" y="410" fill="#17131d" font-size="16">ver cómo funciona, no posar</text>
    <text x="1017" y="230" fill="#f2eadb" font-size="19" font-weight="700">4 · ACCIÓN</text><text x="1017" y="285" fill="#f2eadb" font-size="25" font-weight="700">antes de 24 h</text><text x="1017" y="320" fill="#f2eadb" font-size="16">pequeña · física · verificable</text><text x="1017" y="410" fill="#f2eadb" font-size="16">un bloque que ya existe</text>
  </g><path d="M305 330h32M583 330h32M861 330h32" stroke="#a72c35" stroke-width="7"/><g font-family="Arial,sans-serif"><text x="60" y="550" fill="#17131d" font-size="20" font-weight="700">PRUEBA DE REALIDAD</text><rect x="60" y="580" width="1080" height="80" fill="none" stroke="#a72c35" stroke-width="4"/><text x="90" y="628" fill="#525a61" font-size="20">¿Qué objeto, mensaje, reunión o decisión va a existir mañana porque hoy sostuviste esta visión?</text></g>
</svg>
