<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Del mensaje delegado al mensaje encarnado</title><desc id="desc">Un pasaje interior desde buscar permiso afuera hasta reconocer, practicar y servir desde una conciencia propia.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#a72c35"/></marker></defs>
  <rect width="1200" height="720" fill="#f2eadb"/><text fill="#17131d" font-family="Arial,sans-serif" font-size="31" font-weight="700"><tspan x="60" y="58">EL PASAJE NO ES HACIA OTRO LUGAR.</tspan><tspan x="60" y="92">ES DE AFUERA HACIA ADENTRO.</tspan></text><text x="60" y="126" fill="#525a61" font-family="Arial,sans-serif" font-size="19">Despertar no es una revelación única: es una práctica diaria que se vuelve trato.</text>
  <path d="M165 350H1035" stroke="#a72c35" stroke-width="6" marker-end="url(#arrow)"/><g font-family="Arial,sans-serif" text-anchor="middle">
    <g><circle cx="165" cy="350" r="85" fill="#17131d"/><text x="165" y="338" fill="#f2eadb" font-size="20" font-weight="700">DELEGAR</text><text x="165" y="370" fill="#aeb4b7" font-size="16">“que alguien administre</text><text x="165" y="394" fill="#aeb4b7" font-size="16">lo que está en mí”</text></g>
    <g><circle cx="455" cy="350" r="85" fill="#d6d8d7" stroke="#17131d" stroke-width="4"/><text x="455" y="338" fill="#17131d" font-size="20" font-weight="700">RECONOCER</text><text x="455" y="370" fill="#525a61" font-size="16">mirar el marco</text><text x="455" y="394" fill="#525a61" font-size="16">y volver al espejo</text></g>
    <g><circle cx="745" cy="350" r="85" fill="#aeb4b7" stroke="#17131d" stroke-width="4"/><text x="745" y="338" fill="#17131d" font-size="20" font-weight="700">ENCARNAR</text><text x="745" y="370" fill="#17131d" font-size="16">ver · perdonar</text><text x="745" y="394" fill="#17131d" font-size="16">elegir cada día</text></g>
    <g><circle cx="1035" cy="350" r="85" fill="#a72c35" stroke="#17131d" stroke-width="4"/><text x="1035" y="338" fill="#f2eadb" font-size="20" font-weight="700">SERVIR</text><text x="1035" y="370" fill="#f2eadb" font-size="16">lo interior se vuelve</text><text x="1035" y="394" fill="#f2eadb" font-size="16">acto para otro</text></g>
  </g><g font-family="Arial,sans-serif"><text x="60" y="535" fill="#17131d" font-size="20" font-weight="700">CINCO MINUTOS DE HONESTIDAD</text><rect x="60" y="565" width="1080" height="100" fill="none" stroke="#17131d" stroke-width="3"/><text x="90" y="607" fill="#525a61" font-size="19">¿Qué parte mía espera resurgir? · ¿Qué sigo buscando afuera? · ¿Cómo traté hoy al que me incomoda?</text><text x="90" y="640" fill="#a72c35" font-size="19" font-weight="700">La respuesta válida termina en una acción, no en una identidad.</text></g>
</svg>
