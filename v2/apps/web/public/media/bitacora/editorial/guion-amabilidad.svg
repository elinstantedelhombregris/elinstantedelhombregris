<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Guion para una conversación amable y valiente</title><desc id="desc">Un protocolo que combina regulación, reconocimiento, claridad y compromiso revisable para transformar un conflicto.</desc>
  <rect width="1200" height="720" fill="#f2eadb"/><text x="60" y="76" fill="#17131d" font-family="Arial,sans-serif" font-size="35" font-weight="700">FIRMEZA SIN FURIA. EXIGENCIA SIN DESPRECIO.</text><text x="60" y="112" fill="#525a61" font-family="Arial,sans-serif" font-size="20">La conversación se diseña antes de abrir la boca y se prueba después del acuerdo.</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><g stroke="#17131d" stroke-width="4"><rect x="60" y="175" width="245" height="280" fill="#17131d"/><rect x="338" y="175" width="245" height="280" fill="#d6d8d7"/><rect x="616" y="175" width="245" height="280" fill="#aeb4b7"/><rect x="894" y="175" width="246" height="280" fill="#a72c35"/></g>
    <text x="182" y="225" fill="#f2eadb" font-size="19" font-weight="700">1 · REGULAR</text><text x="182" y="278" fill="#f2eadb" font-size="24" font-weight="700">¿qué emoción</text><text x="182" y="309" fill="#f2eadb" font-size="24" font-weight="700">quiero producir?</text><text x="182" y="385" fill="#aeb4b7" font-size="16">pausa antes de reaccionar</text>
    <text x="460" y="225" fill="#a72c35" font-size="19" font-weight="700">2 · RECONOCER</text><text x="460" y="278" fill="#17131d" font-size="24" font-weight="700">“Valoro...”</text><text x="460" y="309" fill="#17131d" font-size="24" font-weight="700">“Entiendo...”</text><text x="460" y="385" fill="#525a61" font-size="16">validar no es conceder</text>
    <text x="738" y="225" fill="#a72c35" font-size="19" font-weight="700">3 · CLARIFICAR</text><text x="738" y="278" fill="#17131d" font-size="24" font-weight="700">hecho · impacto</text><text x="738" y="309" fill="#17131d" font-size="24" font-weight="700">necesidad</text><text x="738" y="385" fill="#17131d" font-size="16">sin juicio sobre la persona</text>
    <text x="1017" y="225" fill="#f2eadb" font-size="19" font-weight="700">4 · ACORDAR</text><text x="1017" y="278" fill="#f2eadb" font-size="24" font-weight="700">acción · responsable</text><text x="1017" y="309" fill="#f2eadb" font-size="24" font-weight="700">fecha · revisión</text><text x="1017" y="385" fill="#f2eadb" font-size="16">sin cierre, fue catarsis</text>
  </g><g font-family="Arial,sans-serif"><text x="60" y="525" fill="#17131d" font-size="20" font-weight="700">¿FUNCIONÓ?</text><rect x="60" y="555" width="340" height="95" fill="none" stroke="#17131d" stroke-width="3"/><rect x="430" y="555" width="340" height="95" fill="none" stroke="#17131d" stroke-width="3"/><rect x="800" y="555" width="340" height="95" fill="none" stroke="#a72c35" stroke-width="4"/><text x="85" y="594" fill="#17131d" font-size="18" font-weight="700">ACUERDO</text><text x="85" y="623" fill="#525a61" font-size="16">sin desgaste evitable</text><text x="455" y="594" fill="#17131d" font-size="18" font-weight="700">CLARIDAD</text><text x="455" y="623" fill="#525a61" font-size="16">cada persona sabe qué hacer</text><text x="825" y="594" fill="#a72c35" font-size="18" font-weight="700">REVISIÓN</text><text x="825" y="623" fill="#525a61" font-size="16">el compromiso produce evidencia</text></g>
</svg>
