<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura de una decisión colectivamente inteligente</title><desc id="desc">Cuatro condiciones de diversidad, independencia, descentralización y agregación conectadas con evidencia y retroalimentación.</desc>
  <rect width="1200" height="720" fill="#f2eadb"/><text fill="#17131d" font-family="Arial,sans-serif" font-size="31" font-weight="700"><tspan x="60" y="58">JUNTAR GENTE NO ALCANZA.</tspan><tspan x="60" y="92">HAY QUE DISEÑAR CÓMO PIENSA EL GRUPO.</tspan></text><text x="60" y="126" fill="#525a61" font-family="Arial,sans-serif" font-size="19">Las cuatro condiciones protegen la diferencia y la convierten en una decisión evaluable.</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><g stroke="#17131d" stroke-width="4"><rect x="60" y="165" width="250" height="260" fill="#a72c35"/><rect x="337" y="165" width="250" height="260" fill="#d6d8d7"/><rect x="614" y="165" width="250" height="260" fill="#aeb4b7"/><rect x="891" y="165" width="249" height="260" fill="#525a61"/></g>
    <text x="185" y="215" fill="#f2eadb" font-size="19" font-weight="700">1 · DIVERSIDAD</text><text x="185" y="265" fill="#f2eadb" font-size="23" font-weight="700">perspectivas</text><text x="185" y="297" fill="#f2eadb" font-size="23" font-weight="700">realmente distintas</text><text x="185" y="370" fill="#f2eadb" font-size="16">invitar desacuerdo útil</text>
    <text x="462" y="215" fill="#a72c35" font-size="19" font-weight="700">2 · INDEPENDENCIA</text><text x="462" y="265" fill="#17131d" font-size="23" font-weight="700">pensar antes</text><text x="462" y="297" fill="#17131d" font-size="23" font-weight="700">de escuchar al grupo</text><text x="462" y="370" fill="#525a61" font-size="16">ronda privada o anónima</text>
    <text x="739" y="215" fill="#a72c35" font-size="19" font-weight="700">3 · DESCENTRALIZAR</text><text x="739" y="265" fill="#17131d" font-size="23" font-weight="700">información desde</text><text x="739" y="297" fill="#17131d" font-size="23" font-weight="700">múltiples fuentes</text><text x="739" y="370" fill="#17131d" font-size="16">evitar un centro frágil</text>
    <text x="1015" y="215" fill="#f2eadb" font-size="19" font-weight="700">4 · AGREGAR</text><text x="1015" y="265" fill="#f2eadb" font-size="23" font-weight="700">una regla conocida</text><text x="1015" y="297" fill="#f2eadb" font-size="23" font-weight="700">combina aportes</text><text x="1015" y="370" fill="#f2eadb" font-size="16">voto · puntaje · predicción</text>
  </g><path d="M185 445Q600 650 1015 445" fill="none" stroke="#a72c35" stroke-width="6"/><path d="M1015 445Q600 690 185 445" fill="none" stroke="#525a61" stroke-width="3" stroke-dasharray="12 10"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="555" fill="#a72c35" font-size="22" font-weight="700">DECISIÓN + RESULTADO OBSERVABLE</text><text x="600" y="600" fill="#17131d" font-size="20">mostrar qué cambió · comparar con la predicción · ajustar la regla</text><text x="600" y="653" fill="#525a61" font-size="18">Sin devolución, la participación se convierte en extracción de opiniones.</text></g>
</svg>
