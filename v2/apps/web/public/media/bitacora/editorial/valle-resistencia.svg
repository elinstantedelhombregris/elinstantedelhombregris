<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Diseñar el cruce del valle de resistencia</title><desc id="desc">Cuatro principios para achicar el primer paso, volver visible la inacción, crear responsabilidad social y normalizar el medio incómodo.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#a72c35"/></marker></defs>
  <rect width="1200" height="720" fill="#f2eadb"/><text fill="#17131d" font-family="Arial,sans-serif" font-size="31" font-weight="700"><tspan x="60" y="58">NO NECESITÁS MÁS MOTIVACIÓN.</tspan><tspan x="60" y="92">NECESITÁS UN CRUCE DISEÑADO.</tspan></text><text x="60" y="126" fill="#525a61" font-family="Arial,sans-serif" font-size="19">La resistencia protege lo conocido; el método reduce el riesgo de empezar y sostiene el medio feo.</text>
  <path d="M90 275Q300 640 600 485T1110 275" fill="none" stroke="#17131d" stroke-width="6"/><path d="M120 275Q310 580 600 440T1080 275" fill="none" stroke="#a72c35" stroke-width="6" stroke-dasharray="12 12" marker-end="url(#arrow)"/>
  <g font-family="Arial,sans-serif" text-anchor="middle"><g stroke="#17131d" stroke-width="3"><circle cx="190" cy="365" r="78" fill="#17131d"/><circle cx="445" cy="485" r="78" fill="#d6d8d7"/><circle cx="720" cy="445" r="78" fill="#aeb4b7"/><circle cx="990" cy="315" r="78" fill="#a72c35"/></g>
    <text x="190" y="350" fill="#f2eadb" font-size="18" font-weight="700">1 · ACHICAR</text><text x="190" y="380" fill="#aeb4b7" font-size="15">primer paso 80% menor</text><text x="445" y="467" fill="#17131d" font-size="15" font-weight="700">2 · HACER</text><text x="445" y="489" fill="#17131d" font-size="15" font-weight="700">VISIBLE</text><text x="445" y="515" fill="#525a61" font-size="12">costo real de no cambiar</text><text x="720" y="420" fill="#17131d" font-size="15" font-weight="700">3 · CONTARLE</text><text x="720" y="442" fill="#17131d" font-size="15" font-weight="700">A ALGUIEN</text><text x="720" y="468" fill="#17131d" font-size="13">compromiso concreto</text><text x="990" y="293" fill="#f2eadb" font-size="15" font-weight="700">4 · CELEBRAR</text><text x="990" y="316" fill="#f2eadb" font-size="15" font-weight="700">EL MEDIO</text><text x="990" y="342" fill="#f2eadb" font-size="13">incomodidad ≠ fracaso</text>
  </g><g font-family="Arial,sans-serif"><text x="60" y="615" fill="#17131d" font-size="20" font-weight="700">DISEÑO PARA MAÑANA</text><rect x="300" y="585" width="840" height="75" fill="none" stroke="#a72c35" stroke-width="4"/><text x="330" y="632" fill="#525a61" font-size="19">Después de [señal existente], haré [acción de 2 minutos] y se lo mostraré a [persona].</text></g>
</svg>
