<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Protocolo de soberanía cognitiva con inteligencia artificial</title><desc id="desc">Una secuencia para pensar antes de consultar, usar la inteligencia artificial como contraste, verificar y conservar la decisión humana.</desc>
  <rect width="1200" height="720" fill="#f2eadb"/><text x="60" y="76" fill="#17131d" font-family="Arial,sans-serif" font-size="35" font-weight="700">ALQUILÁ VELOCIDAD. NO TERCERICÉS EL CRITERIO.</text><text x="60" y="112" fill="#525a61" font-family="Arial,sans-serif" font-size="20">La herramienta amplía tu inteligencia cuando la pregunta y la decisión siguen siendo tuyas.</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><g stroke="#17131d" stroke-width="4"><rect x="60" y="175" width="245" height="300" fill="#17131d"/><rect x="338" y="175" width="245" height="300" fill="#d6d8d7"/><rect x="616" y="175" width="245" height="300" fill="#aeb4b7"/><rect x="894" y="175" width="246" height="300" fill="#a72c35"/></g>
    <text x="182" y="225" fill="#f2eadb" font-size="19" font-weight="700">ANTES</text><text x="182" y="278" fill="#f2eadb" font-size="25" font-weight="700">pensá primero</text><text x="182" y="315" fill="#aeb4b7" font-size="16">objetivo · hipótesis · límites</text><text x="182" y="405" fill="#f2eadb" font-size="16">escribí tu respuesta inicial</text>
    <text x="460" y="225" fill="#a72c35" font-size="19" font-weight="700">DURANTE</text><text x="460" y="278" fill="#17131d" font-size="25" font-weight="700">pedí contraste</text><text x="460" y="315" fill="#525a61" font-size="16">alternativas · objeciones · fuentes</text><text x="460" y="405" fill="#17131d" font-size="16">no pidas que quiera por vos</text>
    <text x="738" y="225" fill="#a72c35" font-size="19" font-weight="700">DESPUÉS</text><text x="738" y="278" fill="#17131d" font-size="25" font-weight="700">verificá</text><text x="738" y="315" fill="#17131d" font-size="16">hechos · supuestos · ausencias</text><text x="738" y="405" fill="#17131d" font-size="16">compará con tu hipótesis</text>
    <text x="1017" y="225" fill="#f2eadb" font-size="19" font-weight="700">DECIDIR</text><text x="1017" y="278" fill="#f2eadb" font-size="25" font-weight="700">firmá el criterio</text><text x="1017" y="315" fill="#f2eadb" font-size="16">elección · razón · responsabilidad</text><text x="1017" y="405" fill="#f2eadb" font-size="16">explicalo sin la máquina</text>
  </g><path d="M305 330h32M583 330h32M861 330h32" stroke="#a72c35" stroke-width="7"/><g font-family="Arial,sans-serif"><text x="60" y="545" fill="#17131d" font-size="20" font-weight="700">PRUEBA DE SOBERANÍA</text><rect x="60" y="575" width="1080" height="85" fill="none" stroke="#a72c35" stroke-width="4"/><text x="90" y="626" fill="#525a61" font-size="20">Si no podés explicar por qué aceptaste la respuesta, no usaste inteligencia: delegaste autoridad.</text></g>
</svg>
