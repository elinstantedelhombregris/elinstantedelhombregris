<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900" role="img" aria-labelledby="title desc">
  <title id="title">Un circuito posible de la atención</title>
  <desc id="desc">Modelo conceptual, sin magnitudes medidas. El cansancio puede llevar a buscar alivio inmediato; una reacción recompensada puede ocupar el tiempo disponible y dejar menos margen para deliberar, reforzando el cansancio. Las cuatro etapas se destacan una sola vez y luego quedan quietas. Las relaciones son hipótesis que hay que contrastar.</desc>
  <style>
    text{font-family:Arial,sans-serif;fill:#17131d}.k{font-family:monospace;letter-spacing:2px;font-size:21px}.h{font-size:43px;font-weight:700}.b{font-size:29px;font-weight:700}.s{font-size:25px;fill:#4d4547}.node{fill:#eee4d3;stroke:#17131d;stroke-width:2}.pulse{fill:#a72c35;opacity:0;animation:pulse 1.1s ease-in-out both}.p2{animation-delay:1.1s}.p3{animation-delay:2.2s}.p4{animation-delay:3.3s}@keyframes pulse{0%,100%{opacity:0}45%{opacity:.16}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
  </style>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#a72c35" stroke-width="1.5"/></marker></defs>
  <rect width="720" height="900" fill="#f2eadb"/>
  <text x="38" y="47" class="k">01 / MODELO CONCEPTUAL</text>
  <text x="38" y="110" class="h">CÓMO SE CIERRA</text><text x="38" y="159" class="h">UN CIRCUITO</text>
  <path d="M360 303V339M360 448V484M360 593V629M582 705H656V245H582" fill="none" stroke="#a72c35" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <g><rect class="node" x="38" y="195" width="544" height="108"/><rect class="pulse" x="38" y="195" width="544" height="108"/><text x="58" y="236" class="b">Cansancio</text><text x="58" y="275" class="s">Poco margen disponible</text></g>
  <g><rect class="node" x="38" y="340" width="544" height="108"/><rect class="pulse p2" x="38" y="340" width="544" height="108"/><text x="58" y="381" class="b">Alivio inmediato</text><text x="58" y="420" class="s">Buscamos una pausa</text></g>
  <g><rect class="node" x="38" y="485" width="544" height="108"/><rect class="pulse p3" x="38" y="485" width="544" height="108"/><text x="58" y="526" class="b">Reacción recompensada</text><text x="58" y="565" class="s">Aprobación y pertenencia</text></g>
  <g><rect class="node" x="38" y="630" width="544" height="108"/><rect class="pulse p4" x="38" y="630" width="544" height="108"/><text x="58" y="671" class="b">Tiempo ocupado</text><text x="58" y="710" class="s">Menos espacio para deliberar</text></g>
  <path d="M38 780H682" stroke="#17131d" stroke-width="2"/>
  <text x="38" y="821" class="s">Las flechas plantean hipótesis.</text><text x="38" y="858" class="s">El ocio elegido también puede cuidarnos.</text>
</svg>
