<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Sistema del servicio profesional</title><desc id="desc">Cuatro compromisos personales conectados con lenguaje común, modelos replicables y visibilidad pública para escalar el servicio.</desc>
  <rect width="1200" height="720" fill="#f2eadb"/><text fill="#17131d" font-family="Arial,sans-serif" font-size="31" font-weight="700"><tspan x="60" y="58">SERVIR ES HACER QUE UN TALENTO LLEGUE</tspan><tspan x="60" y="92">COMO VALOR A OTRA PERSONA.</tspan></text><text x="60" y="126" fill="#525a61" font-family="Arial,sans-serif" font-size="19">Sin resultado y devolución, puede haber buena intención; todavía no hay servicio profesional.</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><g stroke="#17131d" stroke-width="4"><circle cx="180" cy="300" r="100" fill="#17131d"/><circle cx="460" cy="300" r="100" fill="#d6d8d7"/><circle cx="740" cy="300" r="100" fill="#aeb4b7"/><circle cx="1020" cy="300" r="100" fill="#a72c35"/></g>
    <text x="180" y="286" fill="#f2eadb" font-size="19" font-weight="700">AUTOCONOCER</text><text x="180" y="320" fill="#aeb4b7" font-size="16">qué talento aportás</text><text x="180" y="346" fill="#aeb4b7" font-size="16">y cuál no</text>
    <text x="460" y="286" fill="#17131d" font-size="19" font-weight="700">CORAJE CÍVICO</text><text x="460" y="320" fill="#525a61" font-size="16">nombrar lo que duele</text><text x="460" y="346" fill="#525a61" font-size="16">sin destruir</text>
    <text x="740" y="286" fill="#17131d" font-size="19" font-weight="700">DISCIPLINA</text><text x="740" y="320" fill="#17131d" font-size="16">empatía convertida</text><text x="740" y="346" fill="#17131d" font-size="16">en solución</text>
    <text x="1020" y="286" fill="#f2eadb" font-size="19" font-weight="700">EVALUAR</text><text x="1020" y="320" fill="#f2eadb" font-size="16">¿transformó al otro</text><text x="1020" y="346" fill="#f2eadb" font-size="16">o solo me hizo bien?</text>
  </g><path d="M280 300H360M560 300H640M840 300H920" stroke="#a72c35" stroke-width="6"/><g font-family="Arial,sans-serif"><text x="60" y="470" fill="#17131d" font-size="20" font-weight="700">PARA QUE ESCALE SIN HÉROES</text><rect x="60" y="500" width="330" height="130" fill="#d6d8d7" stroke="#17131d" stroke-width="3"/><rect x="435" y="500" width="330" height="130" fill="#aeb4b7" stroke="#17131d" stroke-width="3"/><rect x="810" y="500" width="330" height="130" fill="none" stroke="#a72c35" stroke-width="4"/><text x="85" y="545" fill="#17131d" font-size="19" font-weight="700">LENGUAJE COMÚN</text><text x="85" y="580" fill="#525a61" font-size="16">preguntas que invitan a co-crear</text><text x="460" y="545" fill="#17131d" font-size="19" font-weight="700">MODELO REPLICABLE</text><text x="460" y="580" fill="#17131d" font-size="16">proceso abierto, no dependencia</text><text x="835" y="545" fill="#a72c35" font-size="19" font-weight="700">RESULTADO VISIBLE</text><text x="835" y="580" fill="#525a61" font-size="16">datos + aprendizaje + reconocimiento</text></g>
</svg>
