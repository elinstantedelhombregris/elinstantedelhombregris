<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">De trahere a entrenar: la cadena etimológica</title><desc id="desc">Cadena de cinco palabras: trahere en latín, traginare en latín vulgar, traîner en francés antiguo, entraîner en francés y entrenar en español, todas con el sentido de arrastrar. Debajo, la familia de palabras tractor, tracción, atraer y extraer.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#17131d"/></marker></defs>
  <rect width="1200" height="460" fill="#f2eadb"/>
  <text x="60" y="70" fill="#17131d" font-family="Arial,sans-serif" font-size="32" font-weight="700">LA PALABRA LO SABÍA</text>
  <text x="60" y="104" fill="#525a61" font-family="Arial,sans-serif" font-size="19">Dos mil años de uso no borraron el gesto original: tirar de un peso en una dirección elegida.</text>
  <g font-family="Arial,sans-serif">
    <rect x="60" y="150" width="180" height="150" fill="#d6d8d7" stroke="#17131d" stroke-width="4"/>
    <text x="150" y="196" text-anchor="middle" fill="#17131d" font-size="24" font-weight="700">TRAHERE</text>
    <text x="150" y="222" text-anchor="middle" fill="#525a61" font-size="15">latín</text>
    <text x="150" y="262" text-anchor="middle" fill="#a72c35" font-size="17" font-weight="700">«tirar, arrastrar»</text>
    <line x1="248" y1="225" x2="275" y2="225" stroke="#17131d" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="285" y="150" width="180" height="150" fill="#d6d8d7" stroke="#17131d" stroke-width="4"/>
    <text x="375" y="196" text-anchor="middle" fill="#17131d" font-size="22" font-weight="700">*TRAGINARE</text>
    <text x="375" y="222" text-anchor="middle" fill="#525a61" font-size="15">latín vulgar</text>
    <text x="375" y="262" text-anchor="middle" fill="#a72c35" font-size="17" font-weight="700">«arrastrar»</text>
    <line x1="473" y1="225" x2="500" y2="225" stroke="#17131d" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="510" y="150" width="180" height="150" fill="#d6d8d7" stroke="#17131d" stroke-width="4"/>
    <text x="600" y="196" text-anchor="middle" fill="#17131d" font-size="24" font-weight="700">TRAÎNER</text>
    <text x="600" y="222" text-anchor="middle" fill="#525a61" font-size="15">francés antiguo</text>
    <text x="600" y="262" text-anchor="middle" fill="#a72c35" font-size="17" font-weight="700">«llevar a rastras»</text>
    <line x1="698" y1="225" x2="725" y2="225" stroke="#17131d" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="735" y="150" width="180" height="150" fill="#d6d8d7" stroke="#17131d" stroke-width="4"/>
    <text x="825" y="196" text-anchor="middle" fill="#17131d" font-size="23" font-weight="700">ENTRAÎNER</text>
    <text x="825" y="222" text-anchor="middle" fill="#525a61" font-size="15">francés</text>
    <text x="825" y="262" text-anchor="middle" fill="#a72c35" font-size="17" font-weight="700">«arrastrar consigo»</text>
    <line x1="923" y1="225" x2="950" y2="225" stroke="#17131d" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="960" y="150" width="180" height="150" fill="#17131d"/>
    <text x="1050" y="196" text-anchor="middle" fill="#f2eadb" font-size="24" font-weight="700">ENTRENAR</text>
    <text x="1050" y="222" text-anchor="middle" fill="#d6d8d7" font-size="15">español</text>
    <text x="1050" y="262" text-anchor="middle" fill="#f2eadb" font-size="16" font-weight="700">«arrastrarse</text>
    <text x="1050" y="284" text-anchor="middle" fill="#f2eadb" font-size="16" font-weight="700">en un rumbo»</text>
  </g>
  <text x="60" y="360" fill="#525a61" font-family="Arial,sans-serif" font-size="19">Misma raíz, misma familia: tractor · tracción · atraer · extraer.</text>
  <text x="60" y="402" fill="#17131d" font-family="Arial,sans-serif" font-size="23" font-weight="700">Entrenar no es levantarse de golpe: es arrastrarse, todos los días, en una dirección.</text>
</svg>
