<svg xmlns="http://www.w3.org/2000/svg" width="720" height="940" viewBox="0 0 720 940" role="img" aria-labelledby="title desc">
  <title id="title">La misma máquina que se come trabajos abarata crear empresas</title>
  <desc id="desc">Esquema ilustrativo, sin cifras medidas. Arriba, arrancar algo antes requería diez personas y un capital que casi nadie tenía; hoy puede arrancarlo una persona con una computadora. Abajo, la cuenta que hay que ganar: la barra del trabajo que crean empresas nuevas tiene que ser más larga que la barra de los trabajos que la inteligencia artificial saca de las empresas existentes.</desc>
  <style>
    text{font-family:Arial,sans-serif;fill:#17131d}
    .k{font-family:monospace;letter-spacing:2px;font-size:20px;fill:#525a61}
    .h{font-size:42px;font-weight:700}
    .b{font-size:22px;font-weight:700}
    .s{font-size:19px;fill:#4d4547}
    .p{fill:#525a61}
    .fade{animation:fade 1.2s ease-in-out both;animation-delay:.4s}
    .one{fill:#a72c35;transform-box:fill-box;transform-origin:center;animation:pop .5s ease-out both;animation-delay:1.4s}
    .gone{fill:#525a61;transform-box:fill-box;transform-origin:left center;animation:bar 1.4s ease-out both;animation-delay:2s}
    .born{fill:#a72c35;transform-box:fill-box;transform-origin:left center;animation:bar 2s ease-out both;animation-delay:2.8s}
    @keyframes fade{from{opacity:1}to{opacity:.28}}
    @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
    @keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @media(prefers-reduced-motion:reduce){.fade,.one,.gone,.born{animation:none}.fade{opacity:.28}}
  </style>
  <defs>
    <g id="pers"><circle cx="0" cy="-26" r="11"/><path d="M-17 14V-4Q-17 -12 -9 -12H9Q17 -12 17 -4V14Z"/></g>
  </defs>
  <rect width="720" height="940" fill="#f2eadb"/>
  <text x="38" y="48" class="k">06 / LA PARADOJA</text>
  <text x="38" y="106" class="h">LA MISMA MÁQUINA</text>
  <text x="38" y="154" class="h">QUE SE COME TRABAJOS</text>
  <text x="38" y="194" class="s">abarata como nunca la creación de empresas</text>

  <rect x="38" y="222" width="644" height="190" fill="#eee4d3" stroke="#17131d" stroke-width="2"/>
  <text x="58" y="260" class="b">Arrancar algo, antes</text>
  <g class="fade">
    <g class="p">
      <use href="#pers" x="88" y="340"/><use href="#pers" x="134" y="340"/><use href="#pers" x="180" y="340"/><use href="#pers" x="226" y="340"/><use href="#pers" x="272" y="340"/>
      <use href="#pers" x="318" y="340"/><use href="#pers" x="364" y="340"/><use href="#pers" x="410" y="340"/><use href="#pers" x="456" y="340"/><use href="#pers" x="502" y="340"/>
    </g>
    <rect x="546" y="298" width="112" height="58" fill="none" stroke="#525a61" stroke-width="2"/>
    <text x="602" y="334" text-anchor="middle" class="s" style="font-size:18px">capital</text>
  </g>
  <text x="58" y="396" class="s" style="font-size:17px">diez personas y una plata que casi nadie tenía</text>

  <rect x="38" y="428" width="644" height="190" fill="#17131d"/>
  <text x="58" y="466" class="b" style="fill:#f2eadb">Arrancar algo, hoy</text>
  <g class="one"><use href="#pers" x="96" y="548"/></g>
  <rect x="136" y="522" width="70" height="44" fill="none" stroke="#f2eadb" stroke-width="2.5"/>
  <path d="M126 572H216" stroke="#f2eadb" stroke-width="3"/>
  <text x="246" y="540" class="s" style="fill:#d6d8d7">una persona, una computadora,</text>
  <text x="246" y="566" class="s" style="fill:#d6d8d7">una idea clara y ganas de</text>
  <text x="246" y="592" class="s" style="fill:#d6d8d7">equivocarse rápido</text>

  <text x="38" y="672" class="b">La cuenta que tenemos que ganar</text>
  <text x="38" y="712" class="s">trabajos que la IA saca de las empresas</text>
  <rect x="38" y="722" width="644" height="34" fill="#d6d8d7"/>
  <rect class="gone" x="38" y="722" width="430" height="34"/>
  <text x="38" y="792" class="s">trabajo que crean empresas nuevas</text>
  <rect x="38" y="802" width="644" height="34" fill="#d6d8d7"/>
  <rect class="born" x="38" y="802" width="560" height="34"/>
  <line x1="468" y1="714" x2="468" y2="846" stroke="#17131d" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="38" y="880" class="b" style="font-size:20px;fill:#a72c35">La barra roja tiene que ser más larga. No hay otra.</text>
  <text x="38" y="912" class="s" style="font-size:16px">Esquema ilustrativo: las longitudes muestran el objetivo, no un dato medido.</text>
</svg>
