<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Del cansancio al prototipo en treinta días</title><desc id="desc">Secuencia para nombrar un sistema roto, identificar el patrón, probar un rediseño y medir y narrar lo aprendido.</desc>
  <rect width="1200" height="720" fill="#f2eadb"/><text fill="#17131d" font-family="Arial,sans-serif" font-size="31" font-weight="700"><tspan x="60" y="58">EL CANSANCIO SE VUELVE BRÚJULA</tspan><tspan x="60" y="92">CUANDO APUNTA A UN SISTEMA.</tspan></text><text x="60" y="126" fill="#525a61" font-family="Arial,sans-serif" font-size="19">Un mes para pasar de la fatiga difusa a una evidencia que otros puedan usar.</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><g stroke="#17131d" stroke-width="4"><rect x="60" y="175" width="245" height="280" fill="#17131d"/><rect x="338" y="175" width="245" height="280" fill="#d6d8d7"/><rect x="616" y="175" width="245" height="280" fill="#aeb4b7"/><rect x="894" y="175" width="246" height="280" fill="#a72c35"/></g>
    <text x="182" y="225" fill="#f2eadb" font-size="19" font-weight="700">1 · NOMBRAR</text><text x="182" y="282" fill="#f2eadb" font-size="25" font-weight="700">UN SISTEMA</text><text x="182" y="322" fill="#aeb4b7" font-size="17">uno, no “todo”</text><text x="182" y="382" fill="#f2eadb" font-size="17">¿qué resultado se repite?</text>
    <text x="460" y="225" fill="#a72c35" font-size="19" font-weight="700">2 · ENCONTRAR</text><text x="460" y="282" fill="#17131d" font-size="25" font-weight="700">EL PATRÓN</text><text x="460" y="322" fill="#525a61" font-size="17">hábito · regla · creencia</text><text x="460" y="382" fill="#17131d" font-size="17">¿qué lo mantiene vivo?</text>
    <text x="738" y="225" fill="#a72c35" font-size="19" font-weight="700">3 · PROBAR</text><text x="738" y="282" fill="#17131d" font-size="25" font-weight="700">UN REDISEÑO</text><text x="738" y="322" fill="#17131d" font-size="17">pequeño · reversible</text><text x="738" y="382" fill="#17131d" font-size="17">menos de 30 días</text>
    <text x="1017" y="225" fill="#f2eadb" font-size="19" font-weight="700">4 · MEDIR</text><text x="1017" y="282" fill="#f2eadb" font-size="25" font-weight="700">Y NARRAR</text><text x="1017" y="322" fill="#f2eadb" font-size="17">resultado + daño</text><text x="1017" y="382" fill="#f2eadb" font-size="17">memoria para replicar</text>
  </g><path d="M305 315h32M583 315h32M861 315h32" stroke="#a72c35" stroke-width="7"/>
  <g font-family="Arial,sans-serif"><text x="60" y="530" fill="#17131d" font-size="20" font-weight="700">RITUAL DIARIO · 15 MINUTOS</text><rect x="60" y="560" width="340" height="95" fill="none" stroke="#17131d" stroke-width="3"/><rect x="430" y="560" width="340" height="95" fill="none" stroke="#17131d" stroke-width="3"/><rect x="800" y="560" width="340" height="95" fill="none" stroke="#a72c35" stroke-width="4"/><text x="85" y="599" fill="#17131d" font-size="18" font-weight="700">LUCIDEZ</text><text x="85" y="628" fill="#525a61" font-size="16">¿qué vi hoy sin anestesiarlo?</text><text x="455" y="599" fill="#17131d" font-size="18" font-weight="700">MICROACCIÓN</text><text x="455" y="628" fill="#525a61" font-size="16">¿qué mejoro antes de dormir?</text><text x="825" y="599" fill="#a72c35" font-size="18" font-weight="700">CONVERSACIÓN</text><text x="825" y="628" fill="#525a61" font-size="16">visión, no otra vuelta de queja</text></g>
</svg>
