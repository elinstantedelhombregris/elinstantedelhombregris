<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Cambiar de eje para salir de la polarización</title><desc id="desc">Comparación entre oscilar en el eje izquierda-derecha y subir a preguntas sobre soberanía, construcción y acción material.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#17131d"/></marker></defs>
  <rect width="1200" height="720" fill="#f2eadb"/><text x="60" y="76" fill="#17131d" font-family="Arial,sans-serif" font-size="35" font-weight="700">NO BUSQUES EL MEDIO DEL MISMO PALO. CAMBIÁ DE EJE.</text><text x="60" y="112" fill="#525a61" font-family="Arial,sans-serif" font-size="20">La pregunta útil no es quién gana la pelea, sino qué capacidad material seguimos sin construir.</text>
  <g font-family="Arial,sans-serif"><rect x="60" y="160" width="470" height="400" fill="#d6d8d7" stroke="#17131d" stroke-width="4"/><text x="95" y="208" fill="#a72c35" font-size="22" font-weight="700">EJE VIEJO · OSCILACIÓN</text><line x1="135" y1="350" x2="455" y2="350" stroke="#17131d" stroke-width="8"/><circle cx="295" cy="350" r="25" fill="#a72c35"/><path d="M295 325Q210 225 130 295" fill="none" stroke="#525a61" stroke-width="5" marker-end="url(#arrow)"/><path d="M295 325Q380 225 460 295" fill="none" stroke="#525a61" stroke-width="5" marker-end="url(#arrow)"/><text x="135" y="400" fill="#17131d" font-size="21" font-weight="700">IZQUIERDA</text><text x="455" y="400" text-anchor="end" fill="#17131d" font-size="21" font-weight="700">DERECHA</text><text x="295" y="485" text-anchor="middle" fill="#525a61" font-size="18">mucho movimiento · cero capacidad nueva</text>
  <rect x="590" y="160" width="550" height="400" fill="#17131d"/><text x="625" y="208" fill="#f2eadb" font-size="22" font-weight="700">EJE NUEVO · CONSTRUCCIÓN</text><line x1="680" y1="465" x2="680" y2="250" stroke="#a72c35" stroke-width="8" marker-end="url(#arrow)"/><text x="710" y="255" fill="#f2eadb" font-size="21" font-weight="700">SOBERANO · CONSTRUCTOR</text><text x="710" y="515" fill="#aeb4b7" font-size="21" font-weight="700">GOBERNADO · CONSTRUIDO</text><g fill="#f2eadb" font-size="18"><text x="710" y="310">1. Pausá antes de reaccionar</text><text x="710" y="348">2. Nombrá quién concentra la decisión</text><text x="710" y="386">3. Convertí bronca en recurso o necesidad</text><text x="710" y="424">4. Construí una capacidad verificable</text></g>
  <text x="60" y="640" fill="#17131d" font-size="21" font-weight="700">PRUEBA RÁPIDA:</text><text x="240" y="640" fill="#525a61" font-size="21">¿esta acción modifica una regla, conecta un recurso o solo alimenta otra vuelta?</text></g>
</svg>
