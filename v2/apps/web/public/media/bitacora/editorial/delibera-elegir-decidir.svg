<svg xmlns="http://www.w3.org/2000/svg" width="720" height="880" viewBox="0 0 720 880" role="img" aria-labelledby="title desc">
  <title id="title">Elegir no es decidir</title>
  <desc id="desc">Dos verbos que usamos como si fueran uno. A la izquierda, elegir, del latín eligere: recoger de entre lo que hay; una bandeja con cinco opciones que armó otra persona y una mano que toma una. A la derecha, decidir, del latín decidere: cortar; un camino que se abre en ramas, con todas las ramas cortadas menos una. Abajo, las familias de cada palabra: de la raíz de elegir vienen leer, colección y élite; de la raíz de decidir vienen preciso, incisión y homicidio.</desc>
  <style>
    text{font-family:Arial,sans-serif;fill:#17131d}
    .k{font-family:monospace;letter-spacing:2px;font-size:20px;fill:#525a61}
    .h{font-size:42px;font-weight:700}
    .s{font-size:22px;fill:#4d4547}
    .lab{font-size:30px;font-weight:700}
    .m{font-family:monospace;font-size:16px}
    .c{fill:#f2eadb}
    .g{fill:#d6d8d7}
    .corte{stroke:#e9a3a8;stroke-width:6;stroke-linecap:round;animation:cortar .35s ease-out both}
    .c2{animation-delay:.5s}.c3{animation-delay:1s}.c4{animation-delay:1.5s}
    @keyframes cortar{from{opacity:0}to{opacity:1}}
    @media(prefers-reduced-motion:reduce){.corte{animation:none}}
  </style>
  <rect width="720" height="880" fill="#f2eadb"/>
  <text x="38" y="48" class="k">01 / ETIMOLOGÍA</text>
  <text x="38" y="106" class="h">ELEGIR NO ES DECIDIR</text>
  <text x="38" y="146" class="s">dos verbos que usamos como si fueran uno</text>

  <!-- ELEGIR -->
  <rect x="38" y="180" width="312" height="440" fill="#eee4d3" stroke="#17131d" stroke-width="2"/>
  <text x="60" y="230" class="lab">ELEGIR</text>
  <text x="60" y="260" class="m">e-ligere</text>
  <text x="60" y="290" class="s" style="font-size:19px">recoger de entre</text>
  <text x="60" y="314" class="s" style="font-size:19px">lo que hay</text>
  <!-- bandeja -->
  <rect x="60" y="430" width="268" height="70" fill="none" stroke="#17131d" stroke-width="3"/>
  <circle cx="92" cy="465" r="18" fill="none" stroke="#17131d" stroke-width="3"/>
  <circle cx="143" cy="465" r="18" fill="none" stroke="#17131d" stroke-width="3"/>
  <circle cx="194" cy="465" r="18" fill="none" stroke="#17131d" stroke-width="3" stroke-dasharray="5 5"/>
  <circle cx="245" cy="465" r="18" fill="none" stroke="#17131d" stroke-width="3"/>
  <circle cx="296" cy="465" r="18" fill="none" stroke="#17131d" stroke-width="3"/>
  <!-- la que se recoge -->
  <line x1="194" y1="440" x2="194" y2="392" stroke="#a72c35" stroke-width="3" stroke-dasharray="6 5"/>
  <circle cx="194" cy="366" r="20" fill="#a72c35"/>
  <text x="60" y="540" class="m">la bandeja ya venía armada</text>
  <text x="60" y="586" class="s" style="font-size:18px">¿Quién puso estas cinco?</text>

  <!-- DECIDIR -->
  <rect x="370" y="180" width="312" height="440" fill="#17131d"/>
  <text x="392" y="230" class="lab c">DECIDIR</text>
  <text x="392" y="260" class="m g">de-caedere</text>
  <text x="392" y="290" class="s g" style="font-size:19px">cortar: dejar afuera</text>
  <text x="392" y="314" class="s g" style="font-size:19px">todo lo demás</text>
  <!-- ramas -->
  <g stroke="#f2eadb" stroke-width="3" fill="none">
    <line x1="526" y1="520" x2="526" y2="450"/>
    <line x1="526" y1="450" x2="420" y2="370"/>
    <line x1="526" y1="450" x2="473" y2="360"/>
    <line x1="526" y1="450" x2="579" y2="360"/>
    <line x1="526" y1="450" x2="632" y2="370"/>
  </g>
  <line x1="526" y1="450" x2="526" y2="346" stroke="#a72c35" stroke-width="5"/>
  <circle cx="526" cy="340" r="9" fill="#a72c35"/>
  <line class="corte" x1="452" y1="412" x2="474" y2="390"/>
  <line class="corte c2" x1="486" y1="404" x2="508" y2="390"/>
  <line class="corte c3" x1="544" y1="390" x2="566" y2="404"/>
  <line class="corte c4" x1="578" y1="390" x2="600" y2="412"/>
  <text x="392" y="560" class="m g">lo que se corta no vuelve</text>
  <text x="392" y="586" class="s c" style="font-size:18px">Por eso decidir cuesta.</text>

  <!-- familias -->
  <text x="38" y="668" class="m" style="fill:#525a61">DE LA MISMA RAÍZ</text>
  <text x="38" y="704" class="s" style="font-size:21px">leer · colección · <tspan style="fill:#a72c35;font-weight:700">élite</tspan></text>
  <text x="370" y="668" class="m" style="fill:#525a61">DE LA MISMA RAÍZ</text>
  <text x="370" y="704" class="s" style="font-size:21px">preciso · incisión · homicidio</text>

  <line x1="38" y1="740" x2="682" y2="740" stroke="#17131d" stroke-width="2"/>
  <text x="38" y="784" style="font-size:24px;font-weight:700">Cada dos años elegimos.</text>
  <text x="38" y="820" style="font-size:24px;font-weight:700;fill:#a72c35">Qué país queremos, nunca lo decidimos.</text>
  <text x="38" y="856" class="s" style="font-size:17px">«Élite» viene del francés élire, elegir: literalmente, los elegidos.</text>
</svg>
