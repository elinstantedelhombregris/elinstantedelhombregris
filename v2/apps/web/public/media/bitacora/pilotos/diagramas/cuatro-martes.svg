<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Piloto barrial de cuatro martes</title>
  <desc id="desc">Calendario mensual para escuchar, ejecutar, registrar, aprender y cerrar una acción barrial con roles y resguardos claros.</desc>
  <defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#17131d" stroke-width="2" opacity=".15"/></pattern></defs>
  <rect width="1200" height="720" fill="#f2eadb"/>
  <text x="60" y="76" fill="#17131d" font-family="Arial, sans-serif" font-size="35" font-weight="700">CUATRO MARTES PARA PROBAR SI PODEMOS SOSTENERNOS</text>
  <text x="60" y="114" fill="#525a61" font-family="Arial, sans-serif" font-size="20">Radio humano · misión acotada · recursos visibles · cierre responsable.</text>
  <g font-family="Arial, sans-serif">
    <rect x="60" y="155" width="1080" height="85" fill="#17131d"/>
    <text x="88" y="190" fill="#f2eadb" font-size="19" font-weight="700">ANTES DE SALIR</text>
    <text x="88" y="219" fill="#f2eadb" font-size="17">Escuchar a quien ya trabaja · acordar la necesidad · pedir consentimiento · asignar roles · publicar recursos</text>
    <g stroke="#17131d" stroke-width="3">
      <rect x="60" y="275" width="255" height="265" fill="#d6d8d7"/><rect x="335" y="275" width="255" height="265" fill="url(#hatch)"/><rect x="610" y="275" width="255" height="265" fill="#aeb4b7"/><rect x="885" y="275" width="255" height="265" fill="#525a61"/>
    </g>
    <g font-weight="700">
      <text x="85" y="318" fill="#a72c35" font-size="20">MARTES 1</text><text x="85" y="360" fill="#17131d" font-size="26">ESCUCHAR</text><text x="85" y="400" fill="#525a61" font-size="17" font-weight="400">Validar necesidad</text><text x="85" y="427" fill="#525a61" font-size="17" font-weight="400">y utilidad esperada</text><text x="85" y="493" fill="#17131d" font-size="16">SALIDA: misión acordada</text>
      <text x="360" y="318" fill="#a72c35" font-size="20">MARTES 2</text><text x="360" y="360" fill="#17131d" font-size="26">HACER</text><text x="360" y="400" fill="#525a61" font-size="17" font-weight="400">Ejecutar sin exhibir</text><text x="360" y="427" fill="#525a61" font-size="17" font-weight="400">a quien recibe</text><text x="360" y="493" fill="#17131d" font-size="16">SALIDA: promesas visibles</text>
      <text x="635" y="318" fill="#a72c35" font-size="20">MARTES 3</text><text x="635" y="360" fill="#17131d" font-size="26">APRENDER</text><text x="635" y="400" fill="#17131d" font-size="17" font-weight="400">Preguntar qué sirvió</text><text x="635" y="427" fill="#17131d" font-size="17" font-weight="400">y qué generó carga</text><text x="635" y="493" fill="#17131d" font-size="16">SALIDA: corrección acordada</text>
      <text x="910" y="318" fill="#f2eadb" font-size="20">MARTES 4</text><text x="910" y="360" fill="#f2eadb" font-size="26">CERRAR</text><text x="910" y="400" fill="#f2eadb" font-size="17" font-weight="400">Continuar, transferir</text><text x="910" y="427" fill="#f2eadb" font-size="17" font-weight="400">o terminar con claridad</text><text x="910" y="493" fill="#f2eadb" font-size="16">SALIDA: memoria replicable</text>
    </g>
  </g>
  <text x="60" y="595" fill="#17131d" font-family="Arial, sans-serif" font-size="20" font-weight="700">MEDIR LO QUE IMPORTA</text>
  <g font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">
    <rect x="60" y="620" width="330" height="62" fill="none" stroke="#17131d" stroke-width="3"/><text x="225" y="659" fill="#17131d">PROMESAS CUMPLIDAS</text>
    <rect x="435" y="620" width="330" height="62" fill="none" stroke="#17131d" stroke-width="3"/><text x="600" y="659" fill="#17131d">UTILIDAD PARA EL BARRIO</text>
    <rect x="810" y="620" width="330" height="62" fill="none" stroke="#a72c35" stroke-width="4"/><text x="975" y="659" fill="#a72c35">DESGASTE DEL EQUIPO</text>
  </g>
</svg>
