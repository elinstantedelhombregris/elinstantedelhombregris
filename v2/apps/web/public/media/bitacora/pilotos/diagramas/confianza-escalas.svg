<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Las tres escalas de la confianza</title>
  <desc id="desc">La confianza se construye desde promesas individuales, reglas organizacionales e instituciones verificables, con evidencia que vuelve a alimentar el ciclo.</desc>
  <rect width="1200" height="720" fill="#f2eadb"/>
  <text x="60" y="70" fill="#17131d" font-family="Arial, sans-serif" font-size="34" font-weight="700">LA CONFIANZA ES UNA CADENA DE EVIDENCIAS</text>
  <g stroke="#17131d" stroke-width="4">
    <rect x="70" y="170" width="300" height="360" fill="#e5dac7"/>
    <rect x="450" y="170" width="300" height="360" fill="#d6d8d7"/>
    <rect x="830" y="170" width="300" height="360" fill="#e8c0b8"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="220" y="225" fill="#17131d" font-size="27" font-weight="700">MICRO</text>
    <text x="220" y="285" fill="#17131d" font-size="21">Promesas pequeñas</text><text x="220" y="320" fill="#17131d" font-size="21">cumplidas</text>
    <text x="220" y="410" fill="#a72c35" font-size="54" font-weight="700">1 → 1</text>
    <text x="220" y="475" fill="#17131d" font-size="18">“Dije / hice”</text>
    <text x="600" y="225" fill="#17131d" font-size="27" font-weight="700">MESO</text>
    <text x="600" y="285" fill="#17131d" font-size="21">Reglas claras</text><text x="600" y="320" fill="#17131d" font-size="21">y decisiones explicadas</text>
    <text x="600" y="410" fill="#525a61" font-size="54" font-weight="700">EQUIPO</text>
    <text x="600" y="475" fill="#17131d" font-size="18">“Se puede verificar”</text>
    <text x="980" y="225" fill="#17131d" font-size="27" font-weight="700">MACRO</text>
    <text x="980" y="285" fill="#17131d" font-size="21">Instituciones auditables</text><text x="980" y="320" fill="#17131d" font-size="21">y derecho a apelar</text>
    <text x="980" y="410" fill="#a72c35" font-size="54" font-weight="700">RED</text>
    <text x="980" y="475" fill="#17131d" font-size="18">“La regla vale para todos”</text>
  </g>
  <g stroke="#17131d" stroke-width="6" fill="none"><path d="M370 350h74"/><path d="m420 330 24 20-24 20"/><path d="M750 350h74"/><path d="m800 330 24 20-24 20"/></g>
  <path d="M980 555Q600 685 220 555" fill="none" stroke="#525a61" stroke-width="5" stroke-dasharray="12 10"/>
  <path d="m238 543-18 12 22 4" fill="none" stroke="#525a61" stroke-width="5"/>
  <text x="600" y="660" text-anchor="middle" fill="#525a61" font-family="Arial, sans-serif" font-size="22" font-weight="700">LA EVIDENCIA INSTITUCIONAL HABILITA NUEVAS PROMESAS</text>
</svg>
