<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Lienzo de diagnóstico sistémico</title>
  <desc id="desc">Ocho campos para pasar de un evento observable a patrones, estructuras, modelos mentales, hipótesis, prototipo, señales y decisión.</desc>
  <defs><pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#17131d" opacity=".15"/></pattern></defs>
  <rect width="1200" height="720" fill="#f2eadb"/>
  <text x="60" y="76" fill="#17131d" font-family="Arial, sans-serif" font-size="35" font-weight="700">LIENZO PARA DEJAR DE CORRER DETRÁS DEL SÍNTOMA</text>
  <text x="60" y="114" fill="#525a61" font-family="Arial, sans-serif" font-size="20">Si una celda queda vacía, encontraste una pregunta de investigación.</text>
  <g font-family="Arial, sans-serif">
    <g><rect x="60" y="155" width="255" height="190" fill="#a72c35" stroke="#17131d" stroke-width="3"/><text x="82" y="194" fill="#f2eadb" font-size="18" font-weight="700">01 · EVENTO</text><text x="82" y="235" fill="#f2eadb" font-size="21" font-weight="700">¿Qué ocurrió?</text><text x="82" y="280" fill="#f2eadb" font-size="16">Hecho fechado</text><text x="82" y="307" fill="#f2eadb" font-size="16">sin culpables ni adjetivos</text></g>
    <g><rect x="335" y="155" width="255" height="190" fill="#d6d8d7" stroke="#17131d" stroke-width="3"/><text x="357" y="194" fill="#a72c35" font-size="18" font-weight="700">02 · PATRÓN</text><text x="357" y="235" fill="#17131d" font-size="21" font-weight="700">¿Qué se repite?</text><text x="357" y="280" fill="#525a61" font-size="16">Frecuencia · tendencia</text><text x="357" y="307" fill="#525a61" font-size="16">excepciones · demoras</text></g>
    <g><rect x="610" y="155" width="255" height="190" fill="url(#dots)" stroke="#17131d" stroke-width="3"/><text x="632" y="194" fill="#a72c35" font-size="18" font-weight="700">03 · ESTRUCTURA</text><text x="632" y="235" fill="#17131d" font-size="21" font-weight="700">¿Qué lo produce?</text><text x="632" y="280" fill="#525a61" font-size="16">Reglas · incentivos</text><text x="632" y="307" fill="#525a61" font-size="16">flujos · actores</text></g>
    <g><rect x="885" y="155" width="255" height="190" fill="#525a61" stroke="#17131d" stroke-width="3"/><text x="907" y="194" fill="#f2eadb" font-size="18" font-weight="700">04 · MODELO MENTAL</text><text x="907" y="235" fill="#f2eadb" font-size="21" font-weight="700">¿Qué lo legitima?</text><text x="907" y="280" fill="#f2eadb" font-size="16">La creencia que vuelve</text><text x="907" y="307" fill="#f2eadb" font-size="16">razonable esa estructura</text></g>
    <g><rect x="60" y="380" width="255" height="190" fill="#17131d" stroke="#17131d" stroke-width="3"/><text x="82" y="419" fill="#f2eadb" font-size="18" font-weight="700">05 · HIPÓTESIS</text><text x="82" y="460" fill="#f2eadb" font-size="21" font-weight="700">Si X, esperamos Y</text><text x="82" y="505" fill="#aeb4b7" font-size="16">Porque creemos que...</text><text x="82" y="532" fill="#aeb4b7" font-size="16">¿qué la refutaría?</text></g>
    <g><rect x="335" y="380" width="255" height="190" fill="#aeb4b7" stroke="#17131d" stroke-width="3"/><text x="357" y="419" fill="#a72c35" font-size="18" font-weight="700">06 · PROTOTIPO</text><text x="357" y="460" fill="#17131d" font-size="21" font-weight="700">Cambio reversible</text><text x="357" y="505" fill="#17131d" font-size="16">Pequeño · acotado</text><text x="357" y="532" fill="#17131d" font-size="16">menos de 30 días</text></g>
    <g><rect x="610" y="380" width="255" height="190" fill="#d6d8d7" stroke="#17131d" stroke-width="3"/><text x="632" y="419" fill="#a72c35" font-size="18" font-weight="700">07 · SEÑALES</text><text x="632" y="460" fill="#17131d" font-size="21" font-weight="700">Resultado + daño</text><text x="632" y="505" fill="#525a61" font-size="16">Una medida de avance</text><text x="632" y="532" fill="#525a61" font-size="16">y una de efecto adverso</text></g>
    <g><rect x="885" y="380" width="255" height="190" fill="none" stroke="#a72c35" stroke-width="5"/><text x="907" y="419" fill="#a72c35" font-size="18" font-weight="700">08 · DECISIÓN</text><text x="907" y="460" fill="#17131d" font-size="21" font-weight="700">Umbral previo</text><text x="907" y="505" fill="#525a61" font-size="16">Escalar · corregir</text><text x="907" y="532" fill="#525a61" font-size="16">o detener</text></g>
  </g>
  <path d="M187 602H1015" stroke="#17131d" stroke-width="5"/><path d="m990 584 25 18-25 18" fill="none" stroke="#17131d" stroke-width="5"/>
  <text x="600" y="661" text-anchor="middle" fill="#525a61" font-family="Arial, sans-serif" font-size="20" font-weight="700">DESCRIBIR → EXPLICAR → PROBAR → APRENDER</text>
</svg>
