<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">De un abrazo excepcional a una red cotidiana</title>
  <desc id="desc">Una emoción nacional intensa se transforma en nodos barriales, roles, frecuencia y seguimiento para sostener la solidaridad en el tiempo.</desc>
  <rect width="1200" height="720" fill="#f2eadb"/>
  <text x="60" y="70" fill="#17131d" font-family="Arial, sans-serif" font-size="34" font-weight="700">LA EMOCIÓN ENCIENDE. LA INFRAESTRUCTURA SOSTIENE.</text>
  <circle cx="245" cy="360" r="150" fill="#a72c35" stroke="#17131d" stroke-width="5"/>
  <text x="245" y="340" text-anchor="middle" fill="#f2eadb" font-family="Arial, sans-serif" font-size="27" font-weight="700">48 HORAS</text>
  <text x="245" y="377" text-anchor="middle" fill="#f2eadb" font-family="Arial, sans-serif" font-size="22">de identidad</text>
  <text x="245" y="408" text-anchor="middle" fill="#f2eadb" font-family="Arial, sans-serif" font-size="22">compartida</text>
  <path d="M405 360H545" stroke="#17131d" stroke-width="8"/>
  <path d="m510 330 38 30-38 30" fill="none" stroke="#17131d" stroke-width="8"/>
  <g stroke="#573c73" stroke-width="5" fill="#e5dac7">
    <path d="M725 220 930 175 1040 350 930 545 710 515 625 340Z" fill="none"/>
    <path d="M725 220 710 515M930 175 625 340M1040 350 710 515M725 220 1040 350M930 545 625 340M930 175 930 545" fill="none"/>
    <circle cx="725" cy="220" r="54"/><circle cx="930" cy="175" r="54"/><circle cx="1040" cy="350" r="54"/><circle cx="930" cy="545" r="54"/><circle cx="710" cy="515" r="54"/><circle cx="625" cy="340" r="54"/>
  </g>
  <g fill="#17131d" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <text x="725" y="216">RADIO</text><text x="725" y="237">LOCAL</text><text x="930" y="171">NECESIDAD</text><text x="930" y="192">CONCRETA</text><text x="1040" y="346">ROL</text><text x="1040" y="367">CLARO</text><text x="930" y="541">FRECUENCIA</text><text x="930" y="562">FIJA</text><text x="710" y="511">RECURSOS</text><text x="710" y="532">TRAZABLES</text><text x="625" y="336">CIERRE</text><text x="625" y="357">VISIBLE</text>
  </g>
  <text x="245" y="565" text-anchor="middle" fill="#17131d" font-family="Arial, sans-serif" font-size="20">Un pico que se disipa</text>
  <text x="835" y="635" text-anchor="middle" fill="#573c73" font-family="Arial, sans-serif" font-size="23" font-weight="700">UNA COSTUMBRE QUE APRENDE Y SE REPLICA</text>
  <text x="60" y="690" fill="#17131d" font-family="Arial, sans-serif" font-size="21">No se trata de abrazarnos siempre: se trata de no volver a empezar de cero.</text>
</svg>
