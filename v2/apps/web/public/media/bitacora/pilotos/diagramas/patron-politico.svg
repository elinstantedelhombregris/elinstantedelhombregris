<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo para detectar un patrón político</title>
  <desc id="desc">Secuencia de promesa emocional, enemigo, concentración, opacidad, decepción y olvido, atravesada por una salida de observación, evidencia y memoria.</desc>
  <rect width="1200" height="720" fill="#f2eadb"/>
  <text x="60" y="70" fill="#17131d" font-family="Arial, sans-serif" font-size="34" font-weight="700">SI EL GUIÓN SE REPITE, DEJÁ DE MIRAR AL ACTOR</text>
  <circle cx="470" cy="380" r="225" fill="none" stroke="#a72c35" stroke-width="16" stroke-dasharray="260 38"/>
  <g fill="#e5dac7" stroke="#17131d" stroke-width="3" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <rect x="385" y="120" width="170" height="64"/><text x="470" y="147" fill="#17131d">PROMESA</text><text x="470" y="170" fill="#17131d">EMOCIONAL</text>
    <rect x="610" y="220" width="170" height="64"/><text x="695" y="247" fill="#17131d">ENEMIGO</text><text x="695" y="270" fill="#17131d">ÚTIL</text>
    <rect x="650" y="455" width="170" height="64"/><text x="735" y="482" fill="#17131d">OPACIDAD</text><text x="735" y="505" fill="#17131d">Y EXCUSAS</text>
    <rect x="360" y="565" width="220" height="64"/><text x="470" y="592" fill="#17131d">DECEPCIÓN</text><text x="470" y="615" fill="#17131d">Y OLVIDO</text>
    <rect x="120" y="375" width="180" height="64"/><text x="210" y="402" fill="#17131d">PODER SIN</text><text x="210" y="425" fill="#17131d">CONTRAPESO</text>
  </g>
  <rect x="880" y="145" width="260" height="420" fill="#525a61" stroke="#17131d" stroke-width="4"/>
  <text x="1010" y="195" text-anchor="middle" fill="#f2eadb" font-family="Arial, sans-serif" font-size="27" font-weight="700">LA SALIDA</text>
  <g fill="#f2eadb" font-family="Arial, sans-serif" font-size="21">
    <text x="920" y="255">1. Pausá</text><text x="920" y="310">2. Nombrá el ciclo</text><text x="920" y="365">3. Buscá evidencia</text><text x="920" y="420">4. Anotá el desenlace</text><text x="920" y="475">5. Exigí métricas</text>
  </g>
  <text x="1010" y="535" text-anchor="middle" fill="#e5dac7" font-family="Arial, sans-serif" font-size="19" font-weight="700">MEMORIA &gt; REACCIÓN</text>
  <path d="M820 355H875" stroke="#17131d" stroke-width="6"/><path d="m850 335 25 20-25 20" fill="none" stroke="#17131d" stroke-width="6"/>
  <text x="60" y="685" fill="#17131d" font-family="Arial, sans-serif" font-size="22">Una intuición se vuelve análisis cuando puede anticipar qué observar después.</text>
</svg>
