  # ── Los cuatro PLANes nuevos (ordinales 23-26, acta del 2026-07-26) ─────────
  # Cargados el 2026-08-02 desde la sección «INTEGRACIÓN CON EL MARCO ¡BASTA!» de
  # cada documento. A diferencia de los veintidós de arriba —cuyas listas salieron
  # del cross-reference scan de abril— éstas salen de lo que cada documento
  # declara de sí mismo, con modo degradado escrito para cada dependencia.
  #
  # `PLANRUTA` NO figura en ningún depends_on de los cuatro, y es deliberado: los
  # tres documentos que quisieron tenderle una arista la bajaron a prosa con la
  # razón escrita (`PLANPACTO:723`, `PLANARCO:779`, `PLANPREGUNTA:750`). No es un
  # olvido de transcripción.

  PLANPACTO:
    depends_on: [PLANMON, PLANDIG, PLANMESA, PLANJUS]
    provides_to: [PLANVIV, PLANCUIDADO, PLANEDU, PLANISV, PLANAGUA, PLANARCO, PLANFOCO]
    integration_strength: alta
    blocking_for_tranche_2: []
    notas: "Reparte más de lo que pide. Su piso del 2,40% es BRUTO y SUSTITUTIVO de los diecisiete anteriores. No es punto único de falla: si no se sanciona, cada PLAN se queda con el reclamo de piso que ya tenía. Lo que la Escalera da es orden, no plata."

  PLANARCO:
    depends_on: [PLANCUIDADO, PLANMON, PLANTER, PLANDIG, PLANSAL, PLANREP, PLANPACTO]
    provides_to: [PLANPACTO]
    integration_strength: critica
    blocking_for_tranche_2: []
    notas: "El nodo más dependiente del corpus: seis dependencias críticas y ninguna capacidad crítica que devolver. PLANPACTO es la séptima y NO es crítica — sin él, el Calendario y la Renta siguen. Par recíproco con PLANPACTO, con las dos mitades escritas."

  PLANPREGUNTA:
    depends_on: [PLANDIG, PLANMESA, PLANTER, PLANFOCO, PLANEDU, PLANJUS, PLANTALLER]
    provides_to: [PLANISV, PLANMEMORIA, PLANEN, PLANGEO, PLANFOCO]
    integration_strength: media
    blocking_for_tranche_2: []
    notas: "PLANTER es la dependencia sin sustituto: sin Fondo Soberano Ciudadano no hay Fondo de la Pregunta, y para el régimen pleno no hay modo degradado. Par recíproco con PLANFOCO. Lo que le pide 'a los veinticinco' —ofrecerse a ser evaluados— no es arista: es renunciable sin consecuencia."

  PLANFOCO:
    depends_on: [PLANMESA, PLANEDU, PLANMEMORIA, PLANDIG, PLANJUS, PLANPACTO, PLANREP, PLANSAL, PLANTALLER]
    provides_to: [PLANPREGUNTA, PLANDIG, PLANCUL]
    integration_strength: media
    blocking_for_tranche_2: []
    notas: "El más desprendible: nueve aristas y solo tres críticas, con una Fase 0 que no depende de que nadie apruebe nada. Su dependencia de PLANDIG NO es crítica y el documento lo escribe: 'ninguna posterga un dispositivo'. Le paga a PLANDIG el Commons Atencional que aquel consagró y no presupuestó."

