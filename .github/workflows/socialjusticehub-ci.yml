name: SocialJusticeHub CI

on:
  push:
    paths:
      - "SocialJusticeHub/**"
      - "Iniciativas Estratégicas/**"
      # La guardia de PLANARCO resuelve `spec:190` contra este archivo, que es la
      # única entrada de DOCUMENTOS_CITABLES (scripts/verificar-planarco.ts) que
      # NO vive en `Iniciativas Estratégicas/`. Sin esta línea, correrle las
      # líneas a la spec rompe la guardia sin que CI llegue a correrla.
      - "v2/docs/specs/2026-07-26-cuatro-planes-nuevos.md"
      # Mismo agujero, segunda vez: la guardia de PLANPUERTA lee este archivo
      # como su SPEC y tampoco vive en `Iniciativas Estratégicas/`. Sin esta
      # línea, correrle las líneas a la spec rompe la guardia sin que CI llegue
      # a correrla.
      - "v2/docs/specs/2026-08-02-planpuerta.md"
      # El agujero al revés, que nadie había mirado hasta el 2026-08-03: no
      # alcanza con preguntar qué lee cada guardia — hay que preguntar qué lee
      # CUALQUIER paso de este workflow. Dos pasos leen fuera de los prefijos
      # de arriba y hasta hoy podían romperse sin que CI llegara a correr:
      #   · `Unit tests` → `tests/unit/deudas-registro.test.ts` abre
      #     `docs/DEUDAS.md` en la raíz del repo, y es la guardia que existe
      #     justamente porque un id de deuda ya significó dos cosas distintas.
      #     Anotar una deuda es la edición que MÁS necesitaba dispararla.
      #   · `Production build` → `scripts/build-ensayos.ts` lee `Ensayos/` en la
      #     raíz y genera `client/src/content/ensayos.generated.ts`. Un ensayo
      #     renombrado o borrado rompe el build.
      - "docs/DEUDAS.md"
      - "Ensayos/**"
      - ".github/workflows/socialjusticehub-ci.yml"
  pull_request:
    paths:
      - "SocialJusticeHub/**"
      - "Iniciativas Estratégicas/**"
      - "v2/docs/specs/2026-07-26-cuatro-planes-nuevos.md"
      - "v2/docs/specs/2026-08-02-planpuerta.md"
      - "docs/DEUDAS.md"
      - "Ensayos/**"
      - ".github/workflows/socialjusticehub-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SocialJusticeHub

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: SocialJusticeHub/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Route duplication guard
        run: npm run check:routes

      - name: Unit tests
        run: npm run test:unit

      - name: Guardia de PLANPACTO
        run: npx tsx scripts/verificar-planpacto.ts

      - name: Guardia de PLANARCO
        run: npx tsx scripts/verificar-planarco.ts

      # Lee tres archivos y los tres ya disparan este workflow: el documento y
      # PLANTER_Argentina_ES.md (`Iniciativas Estratégicas/**`) y el canon de pisos
      # (`SocialJusticeHub/**`). No necesita línea propia en `paths`, y esto queda
      # anotado porque el hueco de la guardia de PLANARCO se descubrió tarde.
      - name: Guardia de PLANPREGUNTA
        run: npx tsx scripts/verificar-planpregunta.ts

      # Lee cuatro archivos y los cuatro ya disparan este workflow: el documento y
      # PLANCUL_Argentina_ES.md (`Iniciativas Estratégicas/**`) y el canon de pisos
      # (`SocialJusticeHub/**`). Sin hueco de paths.
      - name: Guardia de PLANFOCO
        run: npx tsx scripts/verificar-planfoco.ts

      # Lee cuatro archivos. Tres ya disparan este workflow: el documento y
      # PLANVIV_Argentina_ES.md (`Iniciativas Estratégicas/**`) y el canon de
      # pisos (`SocialJusticeHub/**`). El cuarto es su SPEC, que vive en `v2/` y
      # por eso tiene línea propia en las dos listas de `paths` de arriba.
      - name: Guardia de PLANPUERTA
        run: npx tsx scripts/verificar-planpuerta.ts

      # Lee dos archivos y los dos ya disparan este workflow: el documento
      # (`Iniciativas Estratégicas/**`) y el canon de pisos (`SocialJusticeHub/**`).
      # Sin hueco de paths. Verifica el piso de PLANSUS en forma AFIRMATIVA —
      # 0,10% del PBI — porque la SECCIÓN 30 razona sobre ese número contra la
      # Escalera de PLANPACTO: si el canon lo cambia, el documento miente.
      - name: Guardia de PLANSUS
        run: npx tsx scripts/verificar-plansus.ts

      # Lee dos archivos y los dos ya disparan este workflow: el documento
      # (`Iniciativas Estratégicas/**`) y el canon de pisos (`SocialJusticeHub/**`).
      # Sin hueco de paths. Es la ÚNICA guardia que se mira desde afuera: verifica
      # que las cuatro anclas que otros documentos citan por número de línea
      # (PLANGEO:207, :425, :1148, :1151) sigan diciendo lo que el citador afirma.
      # `verificar-remisiones.ts` comprueba que la línea exista; esto comprueba que
      # diga lo mismo, que es lo que rompe cuando se edita PLANGEO más arriba.
      # El piso se verifica POR LA NEGATIVA: PLANGEO tiene que seguir en SIN_PISO.
      - name: Guardia de PLANGEO
        run: npx tsx scripts/verificar-plangeo.ts

      # Barre el corpus entero: resuelve toda cita ARCHIVO:línea contra su archivo.
      # Existe por la primera lección del tramo D — editar un documento ajeno corre
      # sus líneas y rompe remisiones ajenas, y eso se encontró por casualidad.
      # Lee `Iniciativas Estratégicas/**` y `SocialJusticeHub/scripts/**`: los dos
      # disparan este workflow.
      - name: Guardia de remisiones del corpus
        run: npx tsx scripts/verificar-remisiones.ts

      # `client/public/docs/` es una copia derivada del taller y era manual: al
      # 2026-08-01 los 22 documentos que tenía estaban driftados y le faltaban
      # cinco. Esto falla si vuelve a divergir.
      - name: Documentos públicos sincronizados con el taller
        run: npx tsx scripts/sync-docs-publicos.ts --check

      - name: Production build
        run: npm run build
