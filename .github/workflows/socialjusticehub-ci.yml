name: SocialJusticeHub CI

on:
  push:
    paths:
      - "SocialJusticeHub/**"
      - "Iniciativas Estratégicas/**"
      # La guardia de PLANARCO resuelve `spec:190` contra este archivo, que es la
      # única entrada de DOCUMENTOS_CITABLES (scripts/verificar-planarco.ts) que
      # NO vive en `Iniciativas Estratégicas/`. Sin esta línea, correrle las
      # líneas a la spec rompe la guardia sin que CI llegue a correrla.
      - "v2/docs/specs/2026-07-26-cuatro-planes-nuevos.md"
      - ".github/workflows/socialjusticehub-ci.yml"
  pull_request:
    paths:
      - "SocialJusticeHub/**"
      - "Iniciativas Estratégicas/**"
      - "v2/docs/specs/2026-07-26-cuatro-planes-nuevos.md"
      - ".github/workflows/socialjusticehub-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SocialJusticeHub

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: SocialJusticeHub/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Route duplication guard
        run: npm run check:routes

      - name: Unit tests
        run: npm run test:unit

      - name: Guardia de PLANPACTO
        run: npx tsx scripts/verificar-planpacto.ts

      - name: Guardia de PLANARCO
        run: npx tsx scripts/verificar-planarco.ts

      # Lee tres archivos y los tres ya disparan este workflow: el documento y
      # PLANTER_Argentina_ES.md (`Iniciativas Estratégicas/**`) y el canon de pisos
      # (`SocialJusticeHub/**`). No necesita línea propia en `paths`, y esto queda
      # anotado porque el hueco de la guardia de PLANARCO se descubrió tarde.
      - name: Guardia de PLANPREGUNTA
        run: npx tsx scripts/verificar-planpregunta.ts

      # Lee cuatro archivos y los cuatro ya disparan este workflow: el documento y
      # PLANCUL_Argentina_ES.md (`Iniciativas Estratégicas/**`) y el canon de pisos
      # (`SocialJusticeHub/**`). Sin hueco de paths.
      - name: Guardia de PLANFOCO
        run: npx tsx scripts/verificar-planfoco.ts

      # Barre el corpus entero: resuelve toda cita ARCHIVO:línea contra su archivo.
      # Existe por la primera lección del tramo D — editar un documento ajeno corre
      # sus líneas y rompe remisiones ajenas, y eso se encontró por casualidad.
      # Lee `Iniciativas Estratégicas/**` y `SocialJusticeHub/scripts/**`: los dos
      # disparan este workflow.
      - name: Guardia de remisiones del corpus
        run: npx tsx scripts/verificar-remisiones.ts

      # `client/public/docs/` es una copia derivada del taller y era manual: al
      # 2026-08-01 los 22 documentos que tenía estaban driftados y le faltaban
      # cinco. Esto falla si vuelve a divergir.
      - name: Documentos públicos sincronizados con el taller
        run: npx tsx scripts/sync-docs-publicos.ts --check

      - name: Production build
        run: npm run build
