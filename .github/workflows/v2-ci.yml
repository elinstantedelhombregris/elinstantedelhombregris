name: v2 CI

on:
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - 'Iniciativas Estratégicas/**'
      - '.github/workflows/v2-ci.yml'
  pull_request:
    paths:
      - 'v2/**'
      - 'Iniciativas Estratégicas/**'
      - '.github/workflows/v2-ci.yml'

defaults:
  run:
    working-directory: v2

permissions:
  contents: read

jobs:
  build-and-test:
    name: lint · type-check · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: v2/.nvmrc
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test:unit

      - name: Script tests
        run: pnpm test:scripts

      - name: Guardia del índice de planes
        run: pnpm planes:check

      - name: Guardia del corpus de entrenamientos
        run: pnpm entrenamientos:check

      - name: Guardia de dependencias de producción
        run: pnpm deps:check

      - name: Build all workspaces
        env:
          DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
          JWT_SECRET: ci_jwt_secret_placeholder_at_least_32_chars_xxxxxxxxxxxx
          SESSION_SECRET: ci_session_secret_placeholder_at_least_32_chars_xxxxxxxxxxxx
        run: pnpm build

      - name: Bundle size budgets
        env:
          DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
          JWT_SECRET: ci_jwt_secret_placeholder_at_least_32_chars_xxxxxxxxxxxx
          SESSION_SECRET: ci_session_secret_placeholder_at_least_32_chars_xxxxxxxxxxxx
        run: pnpm size

  integration-tests:
    name: integration tests (api ↔ Postgres descartable)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Corre en cada push y cada PR: ya no necesita secretos, porque la base es
    # un contenedor que nace y muere con el job. Antes apuntaba a una rama de
    # Neon (secrets.V2_DATABASE_URL) que quedó archivada, y el job fallaba
    # desde agosto sin probar nada. La app habla con Neon por HTTP; el puente
    # de `packages/db/tests/helpers/neon-local.ts` le hace hablar con este
    # Postgres, y la guardia de D-014 impide que un test escriba en otra base.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: basta_integracion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/basta_integracion_test
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/basta_integracion_test
      DATABASE_URL_DESCARTABLE: postgresql://postgres:postgres@localhost:5432/basta_descartable_test
      MAPA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/basta_descartable_test
      JWT_SECRET: ci_jwt_secret_placeholder_at_least_32_chars_xxxxxxxxxxxx
      SESSION_SECRET: ci_session_secret_placeholder_at_least_32_chars_xxxxxxxxxxxx

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: v2/.nvmrc
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Dos bases en el mismo servidor: las suites que escriben se niegan a
      # correr sobre la base que lee la app (`packages/db/src/base-descartable.ts`).
      - name: Crear la base descartable
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE basta_descartable_test'

      # Migraciones + las 24 provincias (con su relleno de la 0013), insignias,
      # desafíos y áreas de vida, en las dos bases.
      - name: Migrar y sembrar
        run: |
          bash scripts/test/sembrar-base-de-prueba.sh
          DATABASE_URL="$DATABASE_URL_DESCARTABLE" DATABASE_URL_UNPOOLED="$DATABASE_URL_DESCARTABLE" bash scripts/test/sembrar-base-de-prueba.sh

      - name: Run integration tests
        run: pnpm test:integration

  e2e-tests:
    name: end-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: v2/.nvmrc
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        env:
          DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
          JWT_SECRET: ci_jwt_secret_placeholder_at_least_32_chars_xxxxxxxxxxxx
          SESSION_SECRET: ci_session_secret_placeholder_at_least_32_chars_xxxxxxxxxxxx
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: v2/playwright-report/
          retention-days: 7
